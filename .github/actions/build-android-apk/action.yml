name: Build Android APK
description: Set up the pinned Android toolchain and SDK dependencies, then build the AnyKeep APK
inputs:
  abi:
    description: Android ABI used by dependency assets and the output APK name
    required: true
  qt-arch:
    description: Qt Android architecture name used by aqtinstall
    required: true
  qt-version:
    description: Qt version or series
    required: true
  ndk-version:
    description: Android NDK version
    required: true
  android-api:
    description: Android API level
    required: true
  android-openssl-revision:
    description: android_openssl Git revision
    required: true
  qca-tag:
    description: QCA release tag
    required: true
  iris-tag:
    description: Iris release tag
    required: true
  qtkeychain-tag:
    description: QtKeychain dependency release tag
    required: true
  qtkeychain-version:
    description: QtKeychain upstream version
    required: true
  qtkeychain-revision:
    description: QtKeychain package revision
    required: true
  aqt-source:
    description: aqtinstall source used for Qt 6.11 Android repositories
    required: true
  github-token:
    description: GitHub token used to download dependency release assets
    required: true
  signing-keystore-base64:
    description: Base64 persistent signing keystore
    required: false
  allow-debug-signing:
    description: Allow a temporary debug signing key for CI validation only
    required: false
    default: 'false'
  signing-key-alias:
    description: Alias in the signing keystore
    required: false
  signing-store-password:
    description: Signing keystore password
    required: false
  signing-key-password:
    description: Signing key password
    required: false

runs:
  using: composite
  steps:
    - name: Set up Android NDK
      id: setup-ndk
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: ${{ inputs.ndk-version }}

    - name: Install Qt Android
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ inputs.qt-version }}
        host: all_os
        target: android
        arch: ${{ inputs.qt-arch }}
        modules: qtmultimedia qttasktree
        aqtsource: ${{ inputs.aqt-source }}
        cache: true

    - name: Download QCA/Iris/QtKeychain SDKs
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        set -euo pipefail
        mkdir -p qca-sdk iris-sdk qtkeychain-sdk

        gh release download "${{ inputs.qca-tag }}" --repo psi-im/qca \
          -p "qca3-qt6-android-${{ inputs.abi }}.zip" -O qca.zip
        gh release download "${{ inputs.iris-tag }}" --repo psi-im/iris \
          -p "iris-qt6-android-${{ inputs.abi }}.zip" -O iris.zip

        qtkeychain_asset="qtkeychain-${{ inputs.qtkeychain-version }}-${{ inputs.qtkeychain-revision }}-qt6.11-android-${{ inputs.abi }}.tar.gz"
        gh release download "${{ inputs.qtkeychain-tag }}" --repo "$GITHUB_REPOSITORY" \
          -p "$qtkeychain_asset" -O qtkeychain.tar.gz

        (cd qca-sdk && cmake -E tar xvf ../qca.zip)
        (cd iris-sdk && cmake -E tar xvf ../iris.zip)
        tar -xzf qtkeychain.tar.gz -C qtkeychain-sdk

        test -d qca-sdk/lib/cmake/Qca3-qt6
        test -d iris-sdk/lib/cmake/Iris
        test -f qtkeychain-sdk/lib/cmake/Qt6Keychain/Qt6KeychainConfig.cmake
        test -f qtkeychain-sdk/lib/libqt6keychain.a

    - name: Provision Android OpenSSL
      shell: bash
      run: |
        set -euo pipefail
        git clone --filter=blob:none --no-checkout https://github.com/KDAB/android_openssl.git android-openssl
        git -C android-openssl checkout "${{ inputs.android-openssl-revision }}"
        test -f "android-openssl/ssl_3/${{ inputs.abi }}/libcrypto.a"
        test -f "android-openssl/ssl_3/${{ inputs.abi }}/libssl.a"

    - name: Configure and build APK
      shell: bash
      env:
        ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        ANYKEEP_SIGNING_KEYSTORE_BASE64: ${{ inputs.signing-keystore-base64 }}
        ANYKEEP_SIGNING_KEY_ALIAS: ${{ inputs.signing-key-alias }}
        ANYKEEP_SIGNING_STORE_PASSWORD: ${{ inputs.signing-store-password }}
        ANYKEEP_SIGNING_KEY_PASSWORD: ${{ inputs.signing-key-password }}
        ANYKEEP_ALLOW_DEBUG_SIGNING: ${{ inputs.allow-debug-signing }}
      run: |
        set -euo pipefail
        if [[ "$ANYKEEP_ALLOW_DEBUG_SIGNING" != true ]]; then
          : "${ANYKEEP_SIGNING_KEYSTORE_BASE64:?ANDROID_SIGNING_KEYSTORE_BASE64 secret is required}"
          : "${ANYKEEP_SIGNING_KEY_ALIAS:?ANDROID_SIGNING_KEY_ALIAS secret is required}"
          : "${ANYKEEP_SIGNING_STORE_PASSWORD:?ANDROID_SIGNING_STORE_PASSWORD secret is required}"
          : "${ANYKEEP_SIGNING_KEY_PASSWORD:?ANDROID_SIGNING_KEY_PASSWORD secret is required}"
        fi
        python3 -m unittest discover -s .github/scripts -p 'test_inspect_android_apk.py'
        qt_cmake=$(find "$QT_ROOT_DIR" -type f -name qt-cmake -print -quit)
        test -x "$qt_cmake"

        "$qt_cmake" -S . -B build/android-${{ inputs.abi }} -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DANDROID_PLATFORM="android-${{ inputs.android-api }}" \
          -DANYKEEP_BUILD_MOBILE=ON \
          -DANYKEEP_XMPP_BACKEND=IRIS \
          -DANYKEEP_QCA_SDK_ROOT="$PWD/qca-sdk" \
          -DANYKEEP_IRIS_SDK_ROOT="$PWD/iris-sdk" \
          -DANYKEEP_QTKEYCHAIN_SDK_ROOT="$PWD/qtkeychain-sdk" \
          -DANYKEEP_BUILD_BUNDLED_QCA=OFF \
          -DANYKEEP_BUILD_BUNDLED_IRIS=OFF \
          -DANYKEEP_BUILD_BUNDLED_QXMPP=OFF \
          -DANYKEEP_BUILD_BUNDLED_QCORO=OFF \
          -DANYKEEP_BUILD_BUNDLED_QTKEYCHAIN=OFF \
          -DANYKEEP_INSTALL_PREBUILT_SDK_RUNTIME=ON \
          -DANYKEEP_ANDROID_OPENSSL_ROOT="$PWD/android-openssl/ssl_3" \
          -DBUILD_TESTING=OFF

        # Qt 6.11's default QML import scan pulls in every runtime-selectable
        # Quick Controls style. Preserve Qt's dependency resolution but filter
        # only the styles not used on Android, before androiddeployqt copies
        # native libraries and generates its startup metadata. Do not remove
        # individual .so files after packaging.
        settings_file=$(find "build/android-${{ inputs.abi }}" -type f \
          -name 'android-anykeep_mobile-deployment-settings.json' -print -quit)
        test -n "$settings_file"
        chmod +x .github/scripts/filter-android-qml-imports.py
        export ANYKEEP_QMLIMPORTSCANNER_REAL="$(
          python3 .github/scripts/filter-android-qml-imports.py --configure "$settings_file"
        )"
        test -x "$ANYKEEP_QMLIMPORTSCANNER_REAL"
        python3 -m unittest discover -s .github/scripts -p 'test_filter_android_qml_imports.py'

        # Android Release uses lld --strip-debug at link time, rather than
        # changing Ninja's built output after linking (which triggers a relink).
        # Gradle may not find the externally installed NDK to strip JNI libs.
        cmake --build "build/android-${{ inputs.abi }}" --target apk --parallel 4

        mapfile -t app_libraries < <(
          find "build/android-${{ inputs.abi }}" -type f -name 'libanykeep_*.so' \
            ! -path '*/android-build/*' -print
        )
        if [[ ${#app_libraries[@]} -ne 1 ]]; then
          echo "Expected exactly one AnyKeep Android application library, found ${#app_libraries[@]}:" >&2
          printf '  %s\n' "${app_libraries[@]}" >&2
          exit 1
        fi

        app_library="${app_libraries[0]}"
        readelf_tool="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
        test -x "$readelf_tool"

        app_size=$(stat -c '%s' "$app_library")
        echo "AnyKeep Android Release ELF: $app_library ($app_size bytes)"
        if "$readelf_tool" -S "$app_library" | grep -E '\.debug_(info|line|loc|ranges|str)'; then
          echo "Release application library still contains DWARF debug sections" >&2
          exit 1
        fi
        if (( app_size > 32 * 1024 * 1024 )); then
          echo "Release application library is unexpectedly large" >&2
          exit 1
        fi

        mkdir -p packages
        mapfile -t apks < <(
          find "build/android-${{ inputs.abi }}" -type f -path '*/outputs/apk/release/*.apk' -print
        )
        if [[ ${#apks[@]} -ne 1 ]]; then
          echo "Expected exactly one Release APK, found ${#apks[@]}" >&2
          exit 1
        fi
        apk="${apks[0]}"

        bash .github/scripts/sign-android-apk.sh "$apk" "packages/AnyKeep-${{ inputs.abi }}.apk"
        python3 .github/scripts/inspect-android-apk.py "packages/AnyKeep-${{ inputs.abi }}.apk" "${{ inputs.abi }}" "$app_size"
