name: Build Android APK
description: Set up the pinned Android toolchain and SDK dependencies, then build the AnyKeep APK
inputs:
  abi:
    description: Android ABI used by dependency assets and the output APK name
    required: true
  qt-arch:
    description: Qt Android architecture name used by aqtinstall
    required: true
  qt-version:
    description: Qt version or series
    required: true
  qt-sdk-suffix:
    description: Lock-derived Qt SDK suffix for QtKeychain release asset names
    required: true
  ndk-version:
    description: Android NDK version
    required: true
  android-api:
    description: Android API level
    required: true
  android-openssl-revision:
    description: android_openssl Git revision
    required: true
  qca-tag:
    description: QCA release tag
    required: true
  source-qca:
    description: Build QCA providers from source instead of using the QCA SDK
    required: false
    default: 'false'
  iris-tag:
    description: Iris release tag
    required: true
  qtkeychain-tag:
    description: QtKeychain dependency release tag
    required: true
  qtkeychain-version:
    description: QtKeychain upstream version
    required: true
  qtkeychain-revision:
    description: QtKeychain package revision
    required: true
  aqt-source:
    description: aqtinstall source used for Qt 6.12 Android repositories
    required: true
  github-token:
    description: GitHub token used to download dependency release assets
    required: true
  signing-keystore-base64:
    description: Base64 persistent signing keystore
    required: false
  allow-debug-signing:
    description: Allow a temporary debug signing key for CI validation only
    required: false
    default: 'false'
  signing-key-alias:
    description: Alias in the signing keystore
    required: false
  signing-store-password:
    description: Signing keystore password
    required: false
  signing-key-password:
    description: Signing key password
    required: false

runs:
  using: composite
  steps:
    - name: Set up Android NDK
      id: setup-ndk
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: ${{ inputs.ndk-version }}

    - name: Install Qt Android
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ inputs.qt-version }}
        host: all_os
        target: android
        arch: ${{ inputs.qt-arch }}
        modules: qtmultimedia qttasktree
        aqtsource: ${{ inputs.aqt-source }}
        cache: true

    - name: Download QCA/Iris SDKs
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        set -euo pipefail
        mkdir -p qca-sdk iris-sdk qtkeychain-sdk

        gh release download "${{ inputs.qca-tag }}" --repo psi-im/qca \
          -p "qca3-qt6-android-${{ inputs.abi }}.zip" -O qca.zip
        gh release download "${{ inputs.iris-tag }}" --repo psi-im/iris \
          -p "iris-qt6-android-${{ inputs.abi }}.zip" -O iris.zip

        (cd qca-sdk && cmake -E tar xvf ../qca.zip)
        (cd iris-sdk && cmake -E tar xvf ../iris.zip)
        test -d qca-sdk/lib/cmake/Qca3-qt6
        test -d iris-sdk/lib/cmake/Iris

    # QtKeychain 0.14.3 uses the deprecated Android KeyPairGeneratorSpec
    # backend. It can fail to retrieve the RSA key even on a clean install.
    # Keep desktop packages on their existing pinned SDK and build the modern,
    # Android-only backend from the commit pinned in dependencies.lock.json.
    - name: Build pinned Android QtKeychain
      shell: bash
      env:
        ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
      run: |
        set -euo pipefail
        read -r qtkeychain_version qtkeychain_commit < <(python3 - <<'PY'
        import json
        with open('dependencies.lock.json', encoding='utf-8') as f:
            android = json.load(f)['qtkeychain']['android_source']
        print(android['version'], android['commit'])
        PY
        )
        test "${#qtkeychain_commit}" -eq 40
        sudo apt-get update -qq
        sudo apt-get install -y -qq --no-install-recommends extra-cmake-modules
        curl --fail --location --retry 5 --retry-all-errors \
          "https://github.com/frankosterfeld/qtkeychain/archive/${qtkeychain_commit}.tar.gz" \
          -o qtkeychain-android-source.tar.gz
        mkdir -p qtkeychain-source
        tar -xzf qtkeychain-android-source.tar.gz --strip-components=1 -C qtkeychain-source
        grep -F "set(QTKEYCHAIN_VERSION ${qtkeychain_version})" qtkeychain-source/CMakeLists.txt
        qt_cmake=$(find "$QT_ROOT_DIR" -type f -name qt-cmake -print -quit)
        test -x "$qt_cmake"
        "$qt_cmake" -S qtkeychain-source -B qtkeychain-build -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_INSTALL_PREFIX="$PWD/qtkeychain-sdk" \
          -DCMAKE_INSTALL_LIBDIR=lib \
          -DCMAKE_INSTALL_INCLUDEDIR=include \
          -DANDROID_NDK="$ANDROID_NDK_ROOT" \
          -DANDROID_PLATFORM="android-${{ inputs.android-api }}" \
          -DBUILD_SHARED_LIBS=OFF \
          -DBUILD_TEST_APPLICATION=OFF \
          -DBUILD_TRANSLATIONS=OFF \
          -DBUILD_TESTING=OFF \
          -DLIBSECRET_SUPPORT=OFF
        cmake --build qtkeychain-build --parallel 4
        cmake --install qtkeychain-build
        test -f qtkeychain-sdk/include/qt6keychain/keychain.h
        test -f qtkeychain-sdk/lib/cmake/Qt6Keychain/Qt6KeychainConfig.cmake
        test -f qtkeychain-sdk/lib/libqt6keychain.a
        echo "Android QtKeychain: ${qtkeychain_version} (${qtkeychain_commit})"

    - name: Provision Android OpenSSL
      shell: bash
      run: |
        set -euo pipefail
        git clone --filter=blob:none --no-checkout https://github.com/KDAB/android_openssl.git android-openssl
        git -C android-openssl checkout "${{ inputs.android-openssl-revision }}"
        test -f "android-openssl/ssl_3/${{ inputs.abi }}/libcrypto.a"
        test -f "android-openssl/ssl_3/${{ inputs.abi }}/libssl.a"

    - name: Cache Qt's Gradle distribution
      uses: actions/cache@v4
      with:
        path: ~/.gradle/wrapper/dists
        key: anykeep-gradle-wrapper-${{ runner.os }}-qt-${{ inputs.qt-version }}

    - name: Configure and build APK
      shell: bash
      env:
        ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        ANYKEEP_SIGNING_KEYSTORE_BASE64: ${{ inputs.signing-keystore-base64 }}
        ANYKEEP_SIGNING_KEY_ALIAS: ${{ inputs.signing-key-alias }}
        ANYKEEP_SIGNING_STORE_PASSWORD: ${{ inputs.signing-store-password }}
        ANYKEEP_SIGNING_KEY_PASSWORD: ${{ inputs.signing-key-password }}
        ANYKEEP_ALLOW_DEBUG_SIGNING: ${{ inputs.allow-debug-signing }}
      run: |
        set -euo pipefail
        if [[ "$ANYKEEP_ALLOW_DEBUG_SIGNING" != true ]]; then
          : "${ANYKEEP_SIGNING_KEYSTORE_BASE64:?ANDROID_SIGNING_KEYSTORE_BASE64 secret is required}"
          : "${ANYKEEP_SIGNING_KEY_ALIAS:?ANDROID_SIGNING_KEY_ALIAS secret is required}"
          : "${ANYKEEP_SIGNING_STORE_PASSWORD:?ANDROID_SIGNING_STORE_PASSWORD secret is required}"
          : "${ANYKEEP_SIGNING_KEY_PASSWORD:?ANDROID_SIGNING_KEY_PASSWORD secret is required}"
        fi
        python3 -m unittest discover -s .github/scripts -p 'test_xmpp_qml_theme.py'
        python3 -m unittest discover -s .github/scripts -p 'test_inspect_android_apk.py'
        qt_cmake=$(find "$QT_ROOT_DIR" -type f -name qt-cmake -print -quit)
        test -x "$qt_cmake"

        # Use the wrapper version from the installed Qt SDK and verify its checksum,
        # while avoiding services.gradle.org redirects and no-retry defaults.
        # androiddeployqt overlays QT_ANDROID_PACKAGE_SOURCE_DIR onto its template.
        qt_wrapper="$QT_ROOT_DIR/src/3rdparty/gradle/gradle/wrapper/gradle-wrapper.properties"
        test -f "$qt_wrapper"
        custom_wrapper="src/mobile/android/gradle/wrapper/gradle-wrapper.properties"
        mkdir -p "$(dirname "$custom_wrapper")"
        python3 - "$qt_wrapper" "$custom_wrapper" <<'PY'
        from pathlib import Path
        import sys

        source = Path(sys.argv[1]).read_text()
        lines = source.splitlines()
        original_url = next(
            (line.split("=", 1)[1] for line in lines if line.startswith("distributionUrl=")),
            None,
        )
        if not original_url or "services.gradle.org/distributions/" not in original_url:
            raise SystemExit(f"Unexpected Qt Gradle distribution URL: {original_url}")

        # Some Qt SDK builds omit the checksum from their installed template.
        # Keep a verified fallback for Qt 6.12's Gradle 9.5.1. Unknown versions
        # must be reviewed instead of downloading unverified build tools.
        if not any(line.startswith("distributionSha256Sum=") for line in lines):
            import re
            match = re.search(r"/gradle-(\d+(?:\.\d+)+)-bin\.zip$", original_url)
            checksums = {
                "9.5.1": "bafc141b619ad6350fd975fc903156dd5c151998cc8b058e8c1044ab5f7b031f",
            }
            version = match.group(1) if match else None
            if version not in checksums:
                raise SystemExit(f"Missing SHA-256 for Qt Gradle version: {version}")
            lines.append(f"distributionSha256Sum={checksums[version]}")
        replacements = {
            "distributionUrl": original_url.replace("services.gradle.org", "downloads.gradle.org"),
            "networkTimeout": "120000",
            "retries": "4",
            "retryBackOffMs": "2000",
        }
        for name, value in replacements.items():
            replacement = f"{name}={value}"
            matches = [i for i, line in enumerate(lines) if line.startswith(f"{name}=")]
            if matches:
                lines[matches[0]] = replacement
            else:
                lines.append(replacement)
        Path(sys.argv[2]).write_text("\n".join(lines) + "\n")
        PY
        grep -E '^(distributionUrl|distributionSha256Sum|networkTimeout|retries|retryBackOffMs)=' "$custom_wrapper"
        qca_root="$PWD/qca-sdk"
        bundled_qca=OFF
        sdk_runtime=ON
        if [[ '${{ inputs.source-qca }}' == true ]]; then
          qca_root=
          bundled_qca=ON
          sdk_runtime=OFF
        fi

        "$qt_cmake" -S . -B build/android-${{ inputs.abi }} -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DANDROID_PLATFORM="android-${{ inputs.android-api }}" \
          -DANYKEEP_BUILD_MOBILE=ON \
          -DANYKEEP_XMPP_BACKEND=IRIS \
          -DANYKEEP_QCA_SDK_ROOT="$qca_root" \
          -DANYKEEP_IRIS_SDK_ROOT="$PWD/iris-sdk" \
          -DANYKEEP_QTKEYCHAIN_SDK_ROOT="$PWD/qtkeychain-sdk" \
          -DANYKEEP_BUILD_BUNDLED_QCA="$bundled_qca" \
          -DANYKEEP_BUILD_BUNDLED_IRIS=OFF \
          -DANYKEEP_BUILD_BUNDLED_QXMPP=OFF \
          -DANYKEEP_BUILD_BUNDLED_QCORO=OFF \
          -DANYKEEP_BUILD_BUNDLED_QTKEYCHAIN=OFF \
          -DANYKEEP_INSTALL_PREBUILT_SDK_RUNTIME="$sdk_runtime" \
          -DANYKEEP_ANDROID_OPENSSL_ROOT="$PWD/android-openssl/ssl_3" \
          -DBUILD_TESTING=OFF

        # Qt 6.12's default QML import scan pulls in every runtime-selectable
        # Quick Controls style. Preserve Qt's dependency resolution but filter
        # only the styles not used on Android, before androiddeployqt copies
        # native libraries and generates its startup metadata. Do not remove
        # individual .so files after packaging.
        settings_file=$(find "build/android-${{ inputs.abi }}" -type f \
          -name 'android-anykeep_mobile-deployment-settings.json' -print -quit)
        test -n "$settings_file"
        chmod +x .github/scripts/filter-android-qml-imports.py
        export ANYKEEP_QMLIMPORTSCANNER_REAL="$(
          python3 .github/scripts/filter-android-qml-imports.py --configure "$settings_file"
        )"
        test -x "$ANYKEEP_QMLIMPORTSCANNER_REAL"
        python3 -m unittest discover -s .github/scripts -p 'test_filter_android_qml_imports.py'

        # Android Release uses lld --strip-debug at link time, rather than
        # changing Ninja's built output after linking (which triggers a relink).
        # Gradle may not find the externally installed NDK to strip JNI libs.
        cmake --build "build/android-${{ inputs.abi }}" --target apk --parallel 4

        mapfile -t app_libraries < <(
          find "build/android-${{ inputs.abi }}" -type f -name 'libanykeep_*.so' \
            ! -path '*/android-build/*' -print
        )
        if [[ ${#app_libraries[@]} -ne 1 ]]; then
          echo "Expected exactly one AnyKeep Android application library, found ${#app_libraries[@]}:" >&2
          printf '  %s\n' "${app_libraries[@]}" >&2
          exit 1
        fi

        app_library="${app_libraries[0]}"
        readelf_tool="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
        test -x "$readelf_tool"

        app_size=$(stat -c '%s' "$app_library")
        echo "AnyKeep Android Release ELF: $app_library ($app_size bytes)"
        if "$readelf_tool" -S "$app_library" | grep -E '\.debug_(info|line|loc|ranges|str)'; then
          echo "Release application library still contains DWARF debug sections" >&2
          exit 1
        fi
        if (( app_size > 32 * 1024 * 1024 )); then
          echo "Release application library is unexpectedly large" >&2
          exit 1
        fi

        mkdir -p packages
        mapfile -t apks < <(
          find "build/android-${{ inputs.abi }}" -type f -path '*/outputs/apk/release/*.apk' -print
        )
        if [[ ${#apks[@]} -ne 1 ]]; then
          echo "Expected exactly one Release APK, found ${#apks[@]}" >&2
          exit 1
        fi
        apk="${apks[0]}"

        bash .github/scripts/sign-android-apk.sh "$apk" "packages/AnyKeep-${{ inputs.abi }}.apk"
        python3 .github/scripts/inspect-android-apk.py "packages/AnyKeep-${{ inputs.abi }}.apk" "${{ inputs.abi }}" "$app_size"
