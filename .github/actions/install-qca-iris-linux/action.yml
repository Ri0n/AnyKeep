name: Install QCA/Iris Linux packages
description: Download and install prebuilt QCA packages and, when requested, Iris packages for a Debian-family runner
inputs:
  distribution:
    description: Release asset distribution name (ubuntu or debian)
    required: true
  distribution-version:
    description: Distribution version used in the release asset names
    required: true
  qca-tag:
    description: QCA release tag
    required: true
  iris-tag:
    description: Optional Iris release tag; when set, install the matching Iris Debian package set too
    required: false
    default: ""
  github-token:
    description: GitHub token used by gh release download
    required: true

runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        set -euo pipefail

        run_apt() {
          if [[ "$(id -u)" == "0" ]]; then
            apt-get "$@"
          else
            sudo apt-get "$@"
          fi
        }

        asset_suffix="${{ inputs.distribution }}-${{ inputs.distribution-version }}"
        rm -rf qca-release iris-release qca.zip iris.zip
        mkdir qca-release

        gh release download "${{ inputs.qca-tag }}" --repo psi-im/qca \
          -p "qca3-deb-$asset_suffix.zip" -O qca.zip
        (cd qca-release && cmake -E tar xvf ../qca.zip)

        iris_tag="${{ inputs.iris-tag }}"
        if [[ -n "$iris_tag" ]]; then
          mkdir iris-release
          gh release download "$iris_tag" --repo psi-im/iris \
            -p "iris-deb-$asset_suffix.zip" -O iris.zip
          (cd iris-release && cmake -E tar xvf ../iris.zip)
        fi

        run_apt update
        run_apt install -y ./qca-release/*.deb

        if [[ -n "$iris_tag" ]]; then
          run_apt install -y ./iris-release/*.deb
          dpkg-query -W -f='${Status}\n' libiris-qt6-dev | grep -qx 'install ok installed'
        fi
