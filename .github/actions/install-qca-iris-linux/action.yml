name: Install QCA and Iris Linux packages
description: Download and install prebuilt QCA and Iris Debian packages for an Ubuntu runner
inputs:
  ubuntu-version:
    description: Ubuntu version used in the release artifact name
    required: true
  qca-tag:
    description: QCA release tag
    required: true
  iris-tag:
    description: Iris release tag
    required: true
  github-token:
    description: GitHub token used by gh release download
    required: true

runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        set -euo pipefail
        mkdir qca-release iris-release
        gh release download "${{ inputs.qca-tag }}" --repo psi-im/qca \
          -p "qca3-deb-ubuntu-${{ inputs.ubuntu-version }}.zip" -O qca.zip
        gh release download "${{ inputs.iris-tag }}" --repo psi-im/iris \
          -p "iris-deb-ubuntu-${{ inputs.ubuntu-version }}.zip" -O iris.zip
        (cd qca-release && cmake -E tar xvf ../qca.zip)
        (cd iris-release && cmake -E tar xvf ../iris.zip)
        sudo apt-get update
        sudo apt-get install -y ./qca-release/*.deb
        sudo apt-get install -y ./iris-release/*.deb
