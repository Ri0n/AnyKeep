name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_CURRENT_SERIES: "6.11.*"
  # aqtinstall 3.3.0 cannot read the new Windows Qt 6.11 repository layout.
  # PR #1000 contains the upstream fix; remove this override after aqt releases it.
  AQT_WINDOWS_QT611_SOURCE: "git+https://github.com/miurahr/aqtinstall.git@refs/pull/1000/head"

jobs:
  windows:
    name: Windows / Visual Studio 2022 / current Qt
    runs-on: windows-2025
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_CURRENT_SERIES }}
          arch: win64_msvc2022_64
          modules: qtmultimedia qttasktree
          aqtsource: ${{ env.AQT_WINDOWS_QT611_SOURCE }}
          cache: true

      - name: Install Conan
        run: |
          python -m pip install --upgrade "conan>=2,<3"
          conan profile detect --force

      - name: Configure
        run: |
          cmake -S . -B build/windows `
            -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_CONFIGURATION_TYPES=Release `
            -DANYKEEP_UPDATE_CHANNEL=nightly `
            -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build/windows --config Release --parallel 4

      - name: Test
        run: ctest --test-dir build/windows -C Release --output-on-failure --timeout 180

  linux:
    name: Linux / ${{ matrix.label }} / system Qt
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            label: Ubuntu 24.04
            build_dir: build/linux-24.04
          - runner: ubuntu-26.04
            label: Ubuntu 26.04
            build_dir: build/linux-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            gettext \
            libgl1-mesa-dev \
            libhunspell-dev \
            libssl-dev \
            libx11-dev \
            ninja-build \
            pkg-config \
            qml6-module-qtquick \
            qml6-module-qtquick-controls \
            qml6-module-qtquick-layouts \
            qml6-module-qtquick-window \
            qt6-base-dev \
            qt6-declarative-dev \
            qt6-l10n-tools \
            qt6-multimedia-dev \
            qt6-svg-dev \
            qt6-tools-dev \
            qt6-tools-dev-tools

      - name: Report system Qt and compilers
        run: |
          qmake6 -query QT_VERSION
          cc --version
          c++ --version
          cmake --version

      - name: Configure
        run: |
          cmake -S . -B "${{ matrix.build_dir }}" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DANYKEEP_BUILD_BUNDLED_QCA=ON \
            -DANYKEEP_BUILD_BUNDLED_QTKEYCHAIN=ON \
            -DANYKEEP_BUILD_BUNDLED_QXMPP=OFF \
            -DANYKEEP_BUILD_BUNDLED_QCORO=OFF \
            -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build "${{ matrix.build_dir }}" --parallel 4

      - name: Test
        run: ctest --test-dir "${{ matrix.build_dir }}" --output-on-failure --timeout 180

  macos:
    name: macOS / Intel / current Qt compile check
    runs-on: macos-15-intel
    timeout-minutes: 75

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_CURRENT_SERIES }}
          # Qt 6.11's QmlAssetDownloaderPrivate plugin depends on the new
          # TaskTree addon even though AnyKeep does not use TaskTree directly.
          modules: qtmultimedia qttasktree
          cache: true

      - name: Ensure OpenSSL 3 is available
        run: |
          brew list openssl@3 >/dev/null 2>&1 || brew install openssl@3
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"

      - name: Configure
        run: |
          cmake -S . -B build/macos -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DOPENSSL_ROOT_DIR="$OPENSSL_ROOT_DIR" \
            -DANYKEEP_BUILD_BUNDLED_QCA=ON \
            -DANYKEEP_BUILD_BUNDLED_QTKEYCHAIN=ON \
            -DANYKEEP_BUILD_BUNDLED_QXMPP=OFF \
            -DANYKEEP_BUILD_BUNDLED_QCORO=OFF \
            -DBUILD_TESTING=OFF

      - name: Build
        run: cmake --build build/macos --parallel 4
