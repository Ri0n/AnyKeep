name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_CURRENT_SERIES: "6.11.*"
  ANDROID_NDK_VERSION: r27c
  ANDROID_API: 28
  ANDROID_OPENSSL_REVISION: b71f1470962019bd89534a2919f5925f93bc5779
  # aqtinstall 3.3.0 cannot read the new Windows Qt 6.11 repository layout.
  # PR #1000 contains the upstream fix; remove this override after aqt releases it.
  AQT_WINDOWS_QT611_SOURCE: "git+https://github.com/miurahr/aqtinstall.git@refs/pull/1000/head"

jobs:
  package-plan-check:
    name: Package planner / dependency resolution
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate stable dependency lock
        run: python3 .github/scripts/resolve-package-dependencies.py --mode stable

      - name: Resolve compatible nightly dependencies
        id: nightly
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/resolve-package-dependencies.py --mode nightly

      - name: Report nightly dependency set
        run: echo "${{ steps.nightly.outputs.dependency_summary }}"

  windows:
    name: Windows / MSVC + Ninja / current Qt
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Load dependency versions
        uses: ./.github/actions/load-dependencies

      - name: Set up Windows desktop build
        uses: ./.github/actions/setup-windows-desktop
        with:
          qt-version: ${{ env.QT_CURRENT_SERIES }}
          qca-tag: ${{ env.QCA_TAG }}
          qtkeychain-tag: ${{ env.QTKEYCHAIN_TAG }}
          qtkeychain-version: ${{ env.QTKEYCHAIN_VERSION }}
          qtkeychain-revision: ${{ env.QTKEYCHAIN_REVISION }}
          aqt-source: ${{ env.AQT_WINDOWS_QT611_SOURCE }}
          github-token: ${{ github.token }}

      - name: Configure
        run: |
          cmake -S . -B build/windows -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DANYKEEP_UPDATE_CHANNEL=nightly `
            -DANYKEEP_BUILD_BUNDLED_QCA=OFF `
            -DANYKEEP_BUILD_BUNDLED_IRIS=OFF `
            -DANYKEEP_BUILD_BUNDLED_QTKEYCHAIN=OFF `
            -DANYKEEP_QCA_SDK_ROOT="$pwd/qca-sdk" `
            -DANYKEEP_IRIS_SDK_ROOT="$pwd/iris-sdk" `
            -DANYKEEP_QTKEYCHAIN_SDK_ROOT="$pwd/qtkeychain-sdk" `
            -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build/windows --parallel 4

      - name: Test
        run: ctest --test-dir build/windows --output-on-failure --timeout 180

      - name: Print failed or incomplete QtTest reports
        if: failure()
        run: |
          $reportDirectory = "build/windows/test-results"
          if (-not (Test-Path -LiteralPath $reportDirectory)) {
            Write-Host "No QtTest reports were produced."
            exit 0
          }
          Get-ChildItem -LiteralPath $reportDirectory -Filter *.txt | ForEach-Object {
            $report = Get-Content -LiteralPath $_.FullName -Raw
            if ($report -match "(?m)^(FAIL!|QFATAL)" `
                -or $report -match "Totals:.*[1-9][0-9]* failed" `
                -or $report -notmatch "Finished testing") {
              Write-Host "::group::$($_.BaseName)"
              Write-Host $report
              Write-Host "::endgroup::"
            }
          }

      - name: Upload Windows QtTest reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-qtest-reports
          path: build/windows/test-results/*
          if-no-files-found: ignore
          retention-days: 14

  linux:
    name: Linux / ${{ matrix.label }} / system Qt
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            ubuntu-version: "24.04"
            label: Ubuntu 24.04
            build_dir: build/linux-24.04
          - runner: ubuntu-26.04
            ubuntu-version: "26.04"
            label: Ubuntu 26.04
            build_dir: build/linux-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Load dependency versions
        uses: ./.github/actions/load-dependencies

      - name: Download and install QCA packages
        uses: ./.github/actions/install-qca-iris-linux
        with:
          distribution: ubuntu
          distribution-version: ${{ matrix.ubuntu-version }}
          qca-tag: ${{ env.QCA_TAG }}
          github-token: ${{ github.token }}

      - name: Install system dependencies
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            gettext \
            libgl1-mesa-dev \
            libhunspell-dev \
            libssl-dev \
            libusrsctp-dev \
            zlib1g-dev \
            libx11-dev \
            ninja-build \
            pkg-config \
            qml6-module-qtqml-workerscript \
            qml6-module-qtquick \
            qml6-module-qtquick-controls \
            qml6-module-qtquick-layouts \
            qml6-module-qtmultimedia \
            qml6-module-qtquick-templates \
            qml6-module-qtquick-window \
            qt6-base-dev \
            qt6-declarative-dev \
            qt6-l10n-tools \
            qt6-multimedia-dev \
            qt6-svg-dev \
            qt6-tools-dev \
            qt6-tools-dev-tools \
            qtkeychain-qt6-dev

          # Starting with Ubuntu 26.04, the SVG icon/image plugins are split out
          # of libqt6svg6. Noble still ships them in libqt6svg6 itself.
          if apt-cache show qt6-svg-plugins >/dev/null 2>&1; then
            sudo apt-get install -y --no-install-recommends qt6-svg-plugins
          fi

      - name: Report system Qt and compilers
        run: |
          qmake6 -query QT_VERSION
          cc --version
          c++ --version
          cmake --version

      - name: Configure
        run: |
          cmake -S . -B "${{ matrix.build_dir }}" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DANYKEEP_BUILD_BUNDLED_QCA=OFF \
            -DANYKEEP_BUILD_BUNDLED_IRIS=ON \
            -DANYKEEP_BUILD_BUNDLED_QTKEYCHAIN=OFF \
            -DANYKEEP_BUILD_BUNDLED_QXMPP=OFF \
            -DANYKEEP_BUILD_BUNDLED_QCORO=OFF \
            -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build "${{ matrix.build_dir }}" --parallel 4

      - name: Test
        run: ctest --test-dir "${{ matrix.build_dir }}" --output-on-failure --timeout 180

  debian13-package:
    name: Debian 13 / package
    runs-on: ubuntu-latest
    container: debian:13
    timeout-minutes: 120
    steps:
      - name: Bootstrap Debian container
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates cmake gh git python3

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Load dependency versions
        uses: ./.github/actions/load-dependencies

      - name: Build Debian 13 packages
        uses: ./.github/actions/build-deb-package
        with:
          profile: sdk-debian-13
          distribution: debian
          distribution-version: "13"
          qca-tag: ${{ env.QCA_TAG }}
          iris-tag: ${{ env.IRIS_TAG }}
          github-token: ${{ github.token }}

  android:
    name: Android / ${{ matrix.abi }} APK
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            qt-arch: android_arm64_v8a
          - abi: x86_64
            qt-arch: android_x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Load dependency versions
        uses: ./.github/actions/load-dependencies

      - name: Build Android APK
        uses: ./.github/actions/build-android-apk
        with:
          allow-debug-signing: 'true'
          abi: ${{ matrix.abi }}
          qt-arch: ${{ matrix.qt-arch }}
          qt-version: ${{ env.QT_CURRENT_SERIES }}
          ndk-version: ${{ env.ANDROID_NDK_VERSION }}
          android-api: ${{ env.ANDROID_API }}
          android-openssl-revision: ${{ env.ANDROID_OPENSSL_REVISION }}
          qca-tag: ${{ env.QCA_TAG }}
          iris-tag: ${{ env.IRIS_TAG }}
          qtkeychain-tag: ${{ env.QTKEYCHAIN_TAG }}
          qtkeychain-version: ${{ env.QTKEYCHAIN_VERSION }}
          qtkeychain-revision: ${{ env.QTKEYCHAIN_REVISION }}
          aqt-source: ${{ env.AQT_WINDOWS_QT611_SOURCE }}
          github-token: ${{ github.token }}

  macos:
    name: macOS / Intel / current Qt compile check
    runs-on: macos-15-intel
    timeout-minutes: 75

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Load dependency versions
        uses: ./.github/actions/load-dependencies

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_CURRENT_SERIES }}
          # Qt 6.11's QmlAssetDownloaderPrivate plugin depends on the new
          # TaskTree addon even though AnyKeep does not use TaskTree directly.
          modules: qtmultimedia qttasktree
          cache: true

      - name: Ensure OpenSSL 3 is available
        run: |
          brew list openssl@3 >/dev/null 2>&1 || brew install openssl@3
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"

      - name: Download QCA/Iris/QtKeychain SDKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p qca-sdk iris-sdk qtkeychain-sdk

          gh release download "$IRIS_TAG" \
            --repo psi-im/iris \
            -p "iris-qt6-macos-x86_64.zip" \
            -O iris.zip

          gh release download "$QCA_TAG" \
            --repo psi-im/qca \
            -p "qca3-qt6-macos-x86_64.zip" \
            -O qca.zip

          qtkeychain_asset="qtkeychain-${QTKEYCHAIN_VERSION}-${QTKEYCHAIN_REVISION}-qt6.11-macos-x86_64.tar.gz"
          gh release download "$QTKEYCHAIN_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            -p "$qtkeychain_asset" \
            -O qtkeychain.tar.gz

          (cd qca-sdk && cmake -E tar xvf ../qca.zip)
          (cd iris-sdk && cmake -E tar xvf ../iris.zip)
          tar -xzf qtkeychain.tar.gz -C qtkeychain-sdk

          test -d qca-sdk/lib/cmake/Qca3-qt6
          test -d iris-sdk/lib/cmake/Iris
          test -f qtkeychain-sdk/lib/cmake/Qt6Keychain/Qt6KeychainConfig.cmake
          test -f qtkeychain-sdk/lib/libqt6keychain.a

      - name: Configure
        run: |
          cmake -S . -B build/macos -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DOPENSSL_ROOT_DIR="$OPENSSL_ROOT_DIR" \
            -DANYKEEP_BUILD_BUNDLED_QCA=OFF \
            -DANYKEEP_BUILD_BUNDLED_IRIS=OFF \
            -DANYKEEP_BUILD_BUNDLED_QTKEYCHAIN=OFF \
            -DANYKEEP_QCA_SDK_ROOT="$PWD/qca-sdk" \
            -DANYKEEP_IRIS_SDK_ROOT="$PWD/iris-sdk" \
            -DANYKEEP_QTKEYCHAIN_SDK_ROOT="$PWD/qtkeychain-sdk" \
            -DANYKEEP_BUILD_BUNDLED_QXMPP=OFF \
            -DANYKEEP_BUILD_BUNDLED_QCORO=OFF \
            -DBUILD_TESTING=OFF

      - name: Build
        run: cmake --build build/macos --parallel 4
