name: Windows nightly

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-nightly
  cancel-in-progress: true

env:
  QT_CURRENT_SERIES: "6.11.*"
  WIX_VERSION: 6.0.2

jobs:
  package:
    name: Build unsigned Windows nightly
    runs-on: windows-2025
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_CURRENT_SERIES }}
          arch: win64_msvc2022_64
          modules: qtmultimedia
          cache: true

      - name: Install Conan
        run: |
          python -m pip install --upgrade "conan>=2,<3"
          conan profile detect --force

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Install WiX
        run: |
          dotnet tool install --global wix --version $env:WIX_VERSION
          "$HOME\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install WiX extensions
        run: |
          wix.exe extension add -g "WixToolset.Util.wixext/$env:WIX_VERSION"
          wix.exe extension add -g "WixToolset.BootstrapperApplications.wixext/$env:WIX_VERSION"
          wix.exe --version

      - name: Configure
        run: |
          cmake -S . -B build/windows-nightly `
            -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_CONFIGURATION_TYPES=Release `
            -DANYKEEP_UPDATE_CHANNEL=nightly `
            -DBUILD_TESTING=ON

      - name: Build and test
        run: |
          cmake --build build/windows-nightly --config Release --parallel 4
          ctest --test-dir build/windows-nightly -C Release --output-on-failure --timeout 180

      - name: Build update package and installers
        run: |
          cmake --build build/windows-nightly --config Release `
            --target windows_update_package burn_installer `
            --parallel 4

      - name: Upload update package
        uses: actions/upload-artifact@v7
        with:
          name: anykeep-windows-nightly-update-${{ github.run_number }}
          path: build/windows-nightly/updates/nightly/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: anykeep-windows-nightly-installer-${{ github.run_number }}
          path: |
            build/windows-nightly/AnyKeep.msi
            build/windows-nightly/AnyKeep.Installer-*.exe
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
