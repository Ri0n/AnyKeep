name: One-time republish Debian 13 for AnyKeep v4.0.30

# Temporary single-release repair. Remove after successful verification.
on:
  push:
    branches: [master]
    paths:
      - .github/workflows/republish-debian13-v4-0-30.yml

permissions:
  contents: write

jobs:
  republish-debian13:
    name: Rebuild and replace Debian 13 release ZIP
    runs-on: ubuntu-latest
    container: debian:13
    timeout-minutes: 120
    steps:
      - name: Bootstrap Debian 13 container
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates cmake gh git python3

      - uses: actions/checkout@v7
        with:
          ref: v4.0.30
          fetch-depth: 0

      - name: Pin release source and resolve Git version in the Debian container
        shell: bash
        run: |
          set -euo pipefail
          # The checked-out tag is the unchanged source of v4.0.30. Only the
          # Git trust configuration is repaired for the root-owned container;
          # no post-release application commits are included in this package.
          echo "GIT_CONFIG_COUNT=1" >> "$GITHUB_ENV"
          echo "GIT_CONFIG_KEY_0=safe.directory" >> "$GITHUB_ENV"
          echo "GIT_CONFIG_VALUE_0=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          tag="$(git -c "safe.directory=$GITHUB_WORKSPACE" describe --tags --exact-match HEAD)"
          test "$tag" = "v4.0.30"
          test "$(git -c "safe.directory=$GITHUB_WORKSPACE" rev-parse HEAD)" = "a698fc43d1789c7f0f904a5591cce8dc9f3869d7"
          echo "Pinned original source: $tag ($(git -c "safe.directory=$GITHUB_WORKSPACE" rev-parse --short HEAD))"

      - name: Build original release with correctly resolved version
        uses: ./.github/actions/build-deb-package
        with:
          profile: sdk-debian-13
          distribution: debian
          distribution-version: "13"
          qca-tag: v3.2.0
          iris-tag: v1.6.4
          github-token: ${{ github.token }}

      - name: Verify every Debian package and the real versioned libanykeep ELF
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(packages/*.deb)
          if (( ${#packages[@]} == 0 )); then
            echo "::error::No Debian packages were produced"
            exit 1
          fi
          for package in "${packages[@]}"; do
            version="$(dpkg-deb --field "$package" Version)"
            echo "$(basename "$package"): $version"
            if [[ "$version" != "4.0.30" ]]; then
              echo "::error::$package has version $version rather than 4.0.30"
              exit 1
            fi
          done

          libanykeep=(packages/libanykeep3_*.deb)
          if (( ${#libanykeep[@]} != 1 )); then
            echo "::error::Expected exactly one libanykeep3 Debian package"
            exit 1
          fi
          python3 - "${libanykeep[0]}" <<'PY'
          import pathlib
          import re
          import subprocess
          import sys

          package = sys.argv[1]
          listing = subprocess.check_output(["dpkg-deb", "--contents", package], text=True)
          libraries = []
          for line in listing.splitlines():
              parts = line.split()
              if len(parts) < 6 or not parts[0].startswith("-"):
                  continue
              match = re.fullmatch(r"libanykeep\.so\.(\d+\.\d+\.\d+)", pathlib.PurePosixPath(parts[5]).name)
              if match:
                  libraries.append(match.group(1))
          if libraries != ["4.0.30"]:
              raise SystemExit(f"Incorrect libanykeep version in {package}: {libraries}")
          print(f"Verified real libanykeep.so.{libraries[0]} in {package}")
          PY

      - name: Assemble precisely the Debian 13 release asset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          python3 - <<'PY'
          from pathlib import Path
          import zipfile

          files = sorted(
              p for p in Path("packages").glob("*.deb")
              if not p.name.split("_", 1)[0].endswith(("-dbgsym", "-dbg"))
          )
          if not files:
              raise SystemExit("No non-debug Debian binary packages")
          output = Path("release-assets/anykeep-deb-debian-13.zip")
          with zipfile.ZipFile(output, "w", compression=zipfile.ZIP_DEFLATED) as archive:
              for path in files:
                  archive.write(path, path.name)
          with zipfile.ZipFile(output) as archive:
              if archive.testzip() is not None:
                  raise SystemExit("Invalid Debian ZIP archive")
              print("ZIP contains:", archive.namelist())
          PY

      - name: Replace Debian 13 release ZIP only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view v4.0.30 --repo "$GITHUB_REPOSITORY" >/dev/null
          gh release upload v4.0.30 release-assets/anykeep-deb-debian-13.zip --repo "$GITHUB_REPOSITORY" --clobber

      - name: Verify published release ZIP byte for byte
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download v4.0.30 --repo "$GITHUB_REPOSITORY" \
            -p anykeep-deb-debian-13.zip -O downloaded-debian13.zip
          cmp release-assets/anykeep-deb-debian-13.zip downloaded-debian13.zip
          echo "Verified v4.0.30 Debian 13 ZIP matches the rebuilt package."
