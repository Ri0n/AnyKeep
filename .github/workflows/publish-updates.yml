name: Publish AnyKeep updates

on:
  workflow_run:
    workflows: ["AnyKeep packages"]
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  publish-updates:
    name: Publish updater payload
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: anykeep-net
    env:
      ANYKEEP_UPD_PRIVKEY: ${{ secrets.ANYKEEP_UPD_PRIVKEY }}
      ANYKEEP_NET_PORT: ${{ secrets.ANYKEEP_NET_PORT }}
      ANYKEEP_NET_USER: ${{ secrets.ANYKEEP_NET_USER }}
      ANYKEEP_NET_HOST: ${{ secrets.ANYKEEP_NET_HOST }}

    steps:
      - name: Download Windows package artifact
        id: payload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail

          artifact_count="$(
            gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts" \
              --jq '[.artifacts[] | select(.name == "anykeep-windows-x64" and .expired == false)] | length'
          )"

          if [[ "$artifact_count" == "0" ]]; then
            echo "No anykeep-windows-x64 artifact in source run; nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          rm -rf downloaded
          mkdir -p downloaded
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name anykeep-windows-x64 --dir downloaded

          mapfile -t update_dirs < <(
            find downloaded -type d \( -path '*/updates/nightly' -o -path '*/updates/stable' \) -print
          )
          if [[ ${#update_dirs[@]} -eq 0 ]]; then
            echo "Artifact contains no updates/nightly or updates/stable directory; nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ ${#update_dirs[@]} -ne 1 ]]; then
            echo "Expected exactly one update channel directory, found ${#update_dirs[@]}:" >&2
            printf '  %s\n' "${update_dirs[@]}" >&2
            exit 1
          fi

          update_dir="${update_dirs[0]}"
          update_channel="$(basename "$update_dir")"
          printf 'update_dir=%s\n' "$update_dir" >> "$GITHUB_OUTPUT"
          printf 'update_channel=%s\n' "$update_channel" >> "$GITHUB_OUTPUT"
          echo "Publishing update channel: $update_channel"
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Validate GitHub-hosted updater manifest
        id: validate
        if: ${{ steps.payload.outputs.publish == 'true' }}
        shell: bash
        env:
          UPDATE_DIR: ${{ steps.payload.outputs.update_dir }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          from urllib.parse import urlparse

          update_dir = Path(os.environ["UPDATE_DIR"])
          manifest_path = update_dir / "windows-x86_64.json"
          if not manifest_path.is_file():
              raise SystemExit(f"Missing updater manifest: {manifest_path}")

          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          package = manifest.get("package", {})
          version = manifest.get("version", "")
          package_url = package.get("url", "")
          expected_name = f"AnyKeep-{version}-windows-x86_64.msi"
          package_path = update_dir / expected_name

          if manifest.get("schema") != 2 or package.get("format") != "msi":
              raise SystemExit("Unexpected updater manifest schema or package format")
          if not package_path.is_file():
              raise SystemExit(f"Missing versioned MSI used to validate the manifest: {package_path}")

          parsed = urlparse(package_url)
          expected_prefix = f"/{os.environ['GITHUB_REPOSITORY']}/releases/download/"
          if parsed.scheme != "https" or parsed.netloc.lower() != "github.com":
              raise SystemExit(f"Updater package is not hosted on GitHub: {package_url}")
          if not parsed.path.startswith(expected_prefix) or not parsed.path.endswith("/" + expected_name):
              raise SystemExit(f"Updater package URL is outside the AnyKeep release namespace: {package_url}")

          data = package_path.read_bytes()
          actual_hash = hashlib.sha256(data).hexdigest()
          if package.get("sha256", "").lower() != actual_hash:
              raise SystemExit("Updater manifest SHA-256 does not match the versioned MSI")
          if int(package.get("size", -1)) != len(data):
              raise SystemExit("Updater manifest size does not match the versioned MSI")

          immutable = update_dir / f"AnyKeep-{version}-windows-x86_64.json"
          if not immutable.is_file():
              raise SystemExit(f"Missing immutable version manifest: {immutable}")
          if json.loads(immutable.read_text(encoding="utf-8")) != manifest:
              raise SystemExit("Mutable and immutable updater manifests differ")

          output = Path(os.environ["GITHUB_OUTPUT"])
          with output.open("a", encoding="utf-8") as handle:
              handle.write(f"manifest_name={manifest_path.name}\n")
              handle.write(f"package_url={package_url}\n")
          PY

      - name: Configure SSH
        if: ${{ steps.payload.outputs.publish == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          : "${ANYKEEP_UPD_PRIVKEY:?ANYKEEP_UPD_PRIVKEY is not configured}"
          : "${ANYKEEP_NET_PORT:?ANYKEEP_NET_PORT is not configured}"
          : "${ANYKEEP_NET_USER:?ANYKEEP_NET_USER is not configured}"
          : "${ANYKEEP_NET_HOST:?ANYKEEP_NET_HOST is not configured}"

          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$ANYKEEP_UPD_PRIVKEY" > "$HOME/.ssh/anykeep_updates"
          chmod 600 "$HOME/.ssh/anykeep_updates"

          # Pin the configured deployment host key for this run before sending
          # credentials; a dedicated host-key secret can replace ssh-keyscan
          # later if we want out-of-band host-key pinning.
          ssh-keyscan -T 10 -p "$ANYKEEP_NET_PORT" -H "$ANYKEEP_NET_HOST" \
            > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Publish channel manifest only
        if: ${{ steps.payload.outputs.publish == 'true' }}
        shell: bash
        env:
          UPDATE_DIR: ${{ steps.payload.outputs.update_dir }}
          MANIFEST_NAME: ${{ steps.validate.outputs.manifest_name }}
          UPDATE_CHANNEL: ${{ steps.payload.outputs.update_channel }}
        run: |
          set -euo pipefail

          ssh_cmd=(
            ssh
            -i "$HOME/.ssh/anykeep_updates"
            -p "$ANYKEEP_NET_PORT"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
          )
          scp_cmd=(
            scp
            -i "$HOME/.ssh/anykeep_updates"
            -P "$ANYKEEP_NET_PORT"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
          )

          remote="$ANYKEEP_NET_USER@$ANYKEEP_NET_HOST"
          staging="updates/.incoming-${UPDATE_CHANNEL}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          destination="updates/$UPDATE_CHANNEL"

          "${ssh_cmd[@]}" "$remote" \
            "set -eu; rm -rf '$staging'; mkdir -p '$staging' '$destination'"

          cleanup() {
            "${ssh_cmd[@]}" "$remote" "rm -rf '$staging'" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          "${scp_cmd[@]}" \
            "$UPDATE_DIR/$MANIFEST_NAME" \
            "$remote:$staging/"

          # GitHub Releases owns the immutable MSI bytes. anykeep.net only
          # publishes the mutable channel pointer, atomically replacing it
          # after the complete package workflow and GitHub release upload have
          # succeeded.
          "${ssh_cmd[@]}" "$remote" "set -eu; \
            mv -f '$staging/$MANIFEST_NAME' '$destination/windows-x86_64.json'; \
            rmdir '$staging'; \
            find '$destination' -maxdepth 1 -type f \( \
              -name 'AnyKeep-*-windows-x86_64.msi' -o \
              -name 'AnyKeep-*-windows-x86_64.json' -o \
              -name 'SHA256SUMS.txt' \
            \) -delete"

          trap - EXIT

          "${ssh_cmd[@]}" "$remote" \
            "set -eu; ls -lh '$destination/windows-x86_64.json'"
