name: One-time AnyKeep 4.0.30 updater recovery

# Temporary trigger used to dispatch the existing verified publication workflow.
on:
  push:
    branches: [master]
    paths:
      - .github/workflows/recover-anykeep-4-0-30.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch-stable:
    if: ${{ github.event.head_commit.message == 'ci: dispatch AnyKeep 4.0.30 updater publication' }}
    runs-on: ubuntu-latest
    steps:
      - name: Run the existing verified publisher for the successful release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run publish-updates.yml --repo "$GITHUB_REPOSITORY" --ref master --field source_run_id=44555978967
