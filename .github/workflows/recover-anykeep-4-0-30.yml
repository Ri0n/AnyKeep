name: Recover AnyKeep 4.0.30 stable update pointer

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/recover-anykeep-4-0-30.yml

permissions:
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch updater publisher for release 4.0.30
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish-updates.yml --repo "$GITHUB_REPOSITORY" --ref master -f source_run_id=44555978967
