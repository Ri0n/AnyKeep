name: AnyKeep packages

on:
  workflow_dispatch:
    inputs:
      windows_update_channel:
        description: Windows self-update channel
        required: true
        default: stable
        type: choice
        options:
          - stable
          - nightly
  schedule:
    - cron: "0 3 * * *"
  push:
    tags: [ 'v*' ]

permissions:
  contents: read

env:
  QT_CURRENT_SERIES: "6.11.*"
  QCA_TAG: v3.0.1
  IRIS_TAG: v1.0.3
  QTKEYCHAIN_TAG: deps-qtkeychain-0.14.3-r1-qt6.11
  QTKEYCHAIN_VERSION: "0.14.3"
  QTKEYCHAIN_REVISION: "r1"
  ANDROID_NDK_VERSION: r27c
  ANDROID_API: 28
  ANDROID_OPENSSL_REVISION: b71f1470962019bd89534a2919f5925f93bc5779
  WIX_VERSION: 6.0.2
  # Temporary until aqtinstall releases Qt 6.11+ Windows repository support.
  AQT_WINDOWS_QT611_SOURCE: "git+https://github.com/miurahr/aqtinstall.git@refs/pull/1000/head"

jobs:
  nightly_gate:
    name: Check rolling nightly release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - name: Compare nightly release commit
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Manual runs are an explicit request to rebuild. The gate only skips
          # unchanged scheduled nightlies.
          if [[ "${{ github.event_name }}" != "schedule" ]]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          release_body="$(
            gh release view nightly --repo "$GITHUB_REPOSITORY" --json body --jq '.body' 2>/dev/null || true
          )"
          nightly_sha="$(
            printf '%s\n' "$release_body" \
              | sed -nE 's/.*<!-- anykeep-nightly-sha:([0-9a-f]{40}) -->.*/\1/p' \
              | tail -n 1
          )"

          if [[ -z "$nightly_sha" ]]; then
            echo "No successful rolling nightly marker found; building."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          elif [[ "$nightly_sha" == "$GITHUB_SHA" ]]; then
            echo "Rolling nightly already contains $GITHUB_SHA; skipping scheduled build."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "Rolling nightly is $nightly_sha, current master is $GITHUB_SHA; building."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  debian:
    name: Debian package / Ubuntu ${{ matrix.ubuntu-version }}
    if: ${{ github.event_name != 'schedule' }}
    strategy:
      fail-fast: false
      matrix:
        ubuntu-version: ["24.04", "26.04"]
    runs-on: ubuntu-${{ matrix.ubuntu-version }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download and install QCA/Iris packages
        uses: ./.github/actions/install-qca-iris-linux
        with:
          ubuntu-version: ${{ matrix.ubuntu-version }}
          qca-tag: ${{ env.QCA_TAG }}
          iris-tag: ${{ env.IRIS_TAG }}
          github-token: ${{ github.token }}

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake debhelper dh-cmake dh-cmake-compat dh-sequence-cmake \
            dpkg-dev fakeroot libhunspell-dev libx11-dev pkgconf \
            qml6-module-qtqml-workerscript qml6-module-qtquick \
            qml6-module-qtquick-controls qml6-module-qtquick-layouts \
            qml6-module-qtquick-templates qml6-module-qtquick-window \
            qt6-base-dev qt6-base-dev-tools qt6-declarative-dev qt6-l10n-tools \
            qt6-multimedia-dev qt6-svg-dev qt6-tools-dev qt6-tools-dev-tools \
            qtkeychain-qt6-dev
          if apt-cache show qt6-svg-plugins >/dev/null 2>&1; then
            sudo apt-get install -y --no-install-recommends qt6-svg-plugins
          fi

      - name: Build Debian packages
        shell: bash
        run: |
          set -euo pipefail
          ./packaging/build-deb "sdk-ubuntu-${{ matrix.ubuntu-version }}" -b -uc -us
          mkdir packages
          find .. -maxdepth 1 -type f -name '*.deb' -exec cp -v {} packages/ \;
          test -n "$(find packages -type f -name '*.deb' -print -quit)"

      - uses: actions/upload-artifact@v7
        with:
          name: anykeep-deb-ubuntu-${{ matrix.ubuntu-version }}
          path: packages/*.deb
          if-no-files-found: error
          compression-level: 0

  windows:
    name: Windows x64 package
    needs: nightly_gate
    if: ${{ needs.nightly_gate.outputs.should_build == 'true' }}
    permissions:
      contents: write
    runs-on: windows-2022
    timeout-minutes: 150
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Select Windows update channel
        run: |
          $channel = "stable"
          if ("${{ github.event_name }}" -eq "schedule") {
            $channel = "nightly"
          } elseif ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $requested = "${{ inputs.windows_update_channel }}"
            if ($requested) {
              $channel = $requested
            }
          }
          "ANYKEEP_WINDOWS_UPDATE_CHANNEL=$channel" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Windows update channel: $channel"

      - name: Set up Windows desktop build
        uses: ./.github/actions/setup-windows-desktop
        with:
          qt-version: ${{ env.QT_CURRENT_SERIES }}
          qca-tag: ${{ env.QCA_TAG }}
          iris-tag: ${{ env.IRIS_TAG }}
          qtkeychain-tag: ${{ env.QTKEYCHAIN_TAG }}
          qtkeychain-version: ${{ env.QTKEYCHAIN_VERSION }}
          qtkeychain-revision: ${{ env.QTKEYCHAIN_REVISION }}
          aqt-source: ${{ env.AQT_WINDOWS_QT611_SOURCE }}
          github-token: ${{ github.token }}

      - name: Set up WiX
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Install WiX
        run: |
          dotnet tool install --global wix --version $env:WIX_VERSION
          "$HOME\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & "$HOME\.dotnet\tools\wix.exe" extension add -g "WixToolset.Util.wixext/$env:WIX_VERSION"
          & "$HOME\.dotnet\tools\wix.exe" extension add -g "WixToolset.BootstrapperApplications.wixext/$env:WIX_VERSION"

      - name: Configure
        run: |
          $buildTesting = if ($env:ANYKEEP_WINDOWS_UPDATE_CHANNEL -eq "nightly") { "ON" } else { "OFF" }
          cmake -S . -B build/package -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            "-DANYKEEP_UPDATE_CHANNEL=$env:ANYKEEP_WINDOWS_UPDATE_CHANNEL" `
            -DANYKEEP_XMPP_BACKEND=IRIS `
            -DANYKEEP_QCA_SDK_ROOT="$pwd/qca-sdk" `
            -DANYKEEP_IRIS_SDK_ROOT="$pwd/iris-sdk" `
            -DANYKEEP_QTKEYCHAIN_SDK_ROOT="$pwd/qtkeychain-sdk" `
            -DANYKEEP_BUILD_BUNDLED_QCA=OFF `
            -DANYKEEP_BUILD_BUNDLED_IRIS=OFF `
            -DANYKEEP_BUILD_BUNDLED_QXMPP=OFF `
            -DANYKEEP_BUILD_BUNDLED_QCORO=OFF `
            -DANYKEEP_BUILD_BUNDLED_QTKEYCHAIN=OFF `
            -DANYKEEP_INSTALL_PREBUILT_SDK_RUNTIME=ON `
            "-DANYKEEP_MSIX_IDENTITY_NAME=${{ vars.ANYKEEP_MSIX_IDENTITY_NAME }}" `
            "-DANYKEEP_MSIX_PUBLISHER=${{ vars.ANYKEEP_MSIX_PUBLISHER }}" `
            "-DANYKEEP_MSIX_PUBLISHER_DISPLAY_NAME=${{ vars.ANYKEEP_MSIX_PUBLISHER_DISPLAY_NAME }}" `
            "-DBUILD_TESTING=$buildTesting"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build and test nightly tree
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.windows_update_channel == 'nightly') }}
        run: |
          cmake --build build/package --parallel 4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build/package --output-on-failure --timeout 180
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build canonical MSI/update payload and Burn installer
        run: |
          cmake --build build/package --target windows_update_package burn_installer --parallel 4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Store MSIX when identity is configured
        if: ${{ vars.ANYKEEP_MSIX_IDENTITY_NAME != '' && vars.ANYKEEP_MSIX_PUBLISHER != '' && vars.ANYKEEP_MSIX_PUBLISHER_DISPLAY_NAME != '' }}
        run: |
          cmake --build build/package --target msix_package --parallel 4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Explain skipped MSIX build
        if: ${{ vars.ANYKEEP_MSIX_IDENTITY_NAME == '' || vars.ANYKEEP_MSIX_PUBLISHER == '' || vars.ANYKEEP_MSIX_PUBLISHER_DISPLAY_NAME == '' }}
        run: |
          Write-Host "MSIX packaging is ready but Store identity is not configured."
          Write-Host "Configure ANYKEEP_MSIX_IDENTITY_NAME, ANYKEEP_MSIX_PUBLISHER and ANYKEEP_MSIX_PUBLISHER_DISPLAY_NAME."

      - uses: actions/upload-artifact@v7
        with:
          name: anykeep-windows-x64
          path: |
            build/package/AnyKeep.msi
            build/package/AnyKeep.Installer-*.exe
            build/package/AnyKeep-*-windows-x86_64.msix
            build/package/updates/*/*
          if-no-files-found: error
          compression-level: 0

      - name: Publish rolling nightly release
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.windows_update_channel == 'nightly') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $releaseTag = "nightly"
          $releaseTitle = "AnyKeep Nightly"
          $repo = $env:GITHUB_REPOSITORY

          gh release view $releaseTag --repo $repo *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $releaseTag --repo $repo `
              --target $env:GITHUB_SHA `
              --title $releaseTitle `
              --prerelease `
              --notes "Nightly artifacts are being published. No successful build marker has been recorded yet."
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

          $assets = [System.Collections.Generic.List[string]]::new()
          $assets.Add((Resolve-Path "build/package/AnyKeep.msi").Path)
          Get-ChildItem "build/package" -File -Filter "AnyKeep.Installer-*.exe" |
            ForEach-Object { $assets.Add($_.FullName) }
          Get-ChildItem "build/package" -File -Filter "AnyKeep-*-windows-x86_64.msix" |
            ForEach-Object { $assets.Add($_.FullName) }

          $updateDir = "build/package/updates/$env:ANYKEEP_WINDOWS_UPDATE_CHANNEL"
          if (-not (Test-Path -LiteralPath $updateDir)) {
            throw "Nightly update directory is missing: $updateDir"
          }
          Get-ChildItem $updateDir -File | ForEach-Object { $assets.Add($_.FullName) }

          if ($assets.Count -eq 0) {
            throw "No nightly release assets were found"
          }

          $newAssetNames = @{}
          foreach ($asset in $assets) {
            $name = [System.IO.Path]::GetFileName($asset)
            $newAssetNames[$name] = $true
            gh release upload $releaseTag $asset --repo $repo --clobber
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

          # Keep the old release complete until every new asset has uploaded.
          # Only then remove obsolete versioned files left by the previous nightly.
          $oldAssetNames = @(gh release view $releaseTag --repo $repo --json assets --jq '.assets[].name')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($name in $oldAssetNames) {
            if (-not $newAssetNames.ContainsKey($name)) {
              gh release delete-asset $releaseTag $name --repo $repo --yes
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          }

          $builtAt = (Get-Date).ToUniversalTime().ToString("yyyy-MM-dd HH:mm:ss 'UTC'")
          $notes = @"
          Rolling AnyKeep nightly build.

          Commit: $env:GITHUB_SHA
          Built: $builtAt

          <!-- anykeep-nightly-sha:$env:GITHUB_SHA -->
          "@
          $notesFile = Join-Path $env:RUNNER_TEMP "anykeep-nightly-notes.md"
          Set-Content -LiteralPath $notesFile -Value $notes -Encoding utf8

          gh release edit $releaseTag --repo $repo `
            --title $releaseTitle `
            --prerelease `
            --notes-file $notesFile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  macos:
    name: macOS / ${{ matrix.arch }} package
    if: ${{ github.event_name != 'schedule' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_CURRENT_SERIES }}
          modules: qtmultimedia qttasktree
          cache: true

      - name: Install OpenSSL
        run: |
          brew list openssl@3 >/dev/null 2>&1 || brew install openssl@3
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"

      - name: Download QCA/Iris/QtKeychain SDKs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir qca-sdk iris-sdk qtkeychain-sdk
          gh release download "$QCA_TAG" --repo psi-im/qca \
            -p "qca3-qt6-macos-${{ matrix.arch }}.zip" -O qca.zip
          gh release download "$IRIS_TAG" --repo psi-im/iris \
            -p "iris-qt6-macos-${{ matrix.arch }}.zip" -O iris.zip
          qtkeychain_asset="qtkeychain-${QTKEYCHAIN_VERSION}-${QTKEYCHAIN_REVISION}-qt6.11-macos-${{ matrix.arch }}.tar.gz"
          gh release download "$QTKEYCHAIN_TAG" --repo "$GITHUB_REPOSITORY" \
            -p "$qtkeychain_asset" -O qtkeychain.tar.gz
          (cd qca-sdk && cmake -E tar xvf ../qca.zip)
          (cd iris-sdk && cmake -E tar xvf ../iris.zip)
          tar -xzf qtkeychain.tar.gz -C qtkeychain-sdk
          test -d qca-sdk/lib/cmake/Qca3-qt6
          test -d iris-sdk/lib/cmake/Iris
          test -f qtkeychain-sdk/lib/cmake/Qt6Keychain/Qt6KeychainConfig.cmake
          test -f qtkeychain-sdk/lib/libqt6keychain.a

      - name: Configure and build
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build/package -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DOPENSSL_ROOT_DIR="$OPENSSL_ROOT_DIR" \
            -DANYKEEP_XMPP_BACKEND=IRIS \
            -DANYKEEP_QCA_SDK_ROOT="$PWD/qca-sdk" \
            -DANYKEEP_IRIS_SDK_ROOT="$PWD/iris-sdk" \
            -DANYKEEP_QTKEYCHAIN_SDK_ROOT="$PWD/qtkeychain-sdk" \
            -DANYKEEP_BUILD_BUNDLED_QCA=OFF \
            -DANYKEEP_BUILD_BUNDLED_IRIS=OFF \
            -DANYKEEP_BUILD_BUNDLED_QXMPP=OFF \
            -DANYKEEP_BUILD_BUNDLED_QCORO=OFF \
            -DANYKEEP_BUILD_BUNDLED_QTKEYCHAIN=OFF \
            -DANYKEEP_INSTALL_PREBUILT_SDK_RUNTIME=ON \
            -DBUILD_TESTING=OFF
          cmake --build build/package --parallel 4
          cmake --install build/package --prefix "$PWD/stage"

      - name: Assemble standalone app bundle
        shell: bash
        run: |
          set -euo pipefail
          app="$PWD/stage/anykeep.app"
          test -d "$app"
          mkdir -p "$app/Contents/Frameworks" "$app/Contents/plugins" "$app/Contents/PlugIns/qca3-qt6/crypto"

          find stage/lib -maxdepth 1 \( -type f -o -type l \) -name 'libanykeep*.dylib' \
            -exec cp -a {} "$app/Contents/Frameworks/" \;
          if [ -d stage/lib/anykeep ]; then
            cp -a stage/lib/anykeep/. "$app/Contents/plugins/"
          fi
          find qca-sdk/lib -maxdepth 1 \( -type f -o -type l \) -name 'libqca*.dylib*' \
            -exec cp -a {} "$app/Contents/Frameworks/" \;
          find iris-sdk/lib -maxdepth 1 \( -type f -o -type l \) -name 'libiris*.dylib*' \
            -exec cp -a {} "$app/Contents/Frameworks/" \;
          find qca-sdk/lib/qca3-qt6/crypto -maxdepth 1 -type f -name '*.dylib' \
            -exec cp -a {} "$app/Contents/PlugIns/qca3-qt6/crypto/" \;

          openssl_lib="$(brew --prefix openssl@3)/lib"
          crypto="$openssl_lib/libcrypto.3.dylib"
          ssl="$openssl_lib/libssl.3.dylib"
          test -f "$crypto"
          test -f "$ssl"
          cp -a "$crypto" "$ssl" "$app/Contents/Frameworks/"

          "$QT_ROOT_DIR/bin/macdeployqt" "$app" "-qmldir=$PWD/libanykeep/qml" -always-overwrite

          crypto_name="$(basename "$crypto")"
          ssl_name="$(basename "$ssl")"
          bundled_crypto="$app/Contents/Frameworks/$crypto_name"
          bundled_ssl="$app/Contents/Frameworks/$ssl_name"
          install_name_tool -id "@rpath/$crypto_name" "$bundled_crypto"
          install_name_tool -id "@rpath/$ssl_name" "$bundled_ssl"

          # libssl and QCA providers are not Qt-owned dependencies, so macdeployqt
          # does not relocate their Homebrew OpenSSL install names for us. Keep
          # the provider independent of the main executable's LC_RPATH and make
          # libssl resolve libcrypto next to itself.
          while IFS= read -r dependency; do
            case "$dependency" in
              */libcrypto.3.dylib)
                install_name_tool -change "$dependency" "@loader_path/$crypto_name" "$bundled_ssl"
                ;;
            esac
          done < <(otool -L "$bundled_ssl" | tail -n +2 | sed -E 's/^[[:space:]]*([^[:space:]]+).*/\1/')

          while IFS= read -r -d '' provider; do
            while IFS= read -r dependency; do
              case "$dependency" in
                */libcrypto.3.dylib)
                  install_name_tool -change "$dependency" "@loader_path/../../../Frameworks/$crypto_name" "$provider"
                  ;;
                */libssl.3.dylib)
                  install_name_tool -change "$dependency" "@loader_path/../../../Frameworks/$ssl_name" "$provider"
                  ;;
              esac
            done < <(otool -L "$provider" | tail -n +2 | sed -E 's/^[[:space:]]*([^[:space:]]+).*/\1/')
          done < <(find "$app/Contents/PlugIns/qca3-qt6/crypto" -type f -name '*.dylib' -print0)

          bad_dependencies="$(
            find "$app" -type f -print0 | while IFS= read -r -d '' binary; do
              file "$binary" | grep -q 'Mach-O' || continue
              # Dependency records are indented. Ignore otool architecture
              # headers such as "... (architecture arm64):", which contain
              # the bundle path itself and otherwise cause false positives.
              otool -L "$binary" | sed -nE 's/^[[:space:]]+([^[:space:]]+).*/\1/p'
            done | grep -E "$PWD/(qca-sdk|iris-sdk|build|stage)|/(opt/homebrew|usr/local)/opt/openssl" || true
          )"
          if [ -n "$bad_dependencies" ]; then
            echo 'Non-relocatable dependency remains in the app bundle:' >&2
            printf '%s\n' "$bad_dependencies" >&2
            exit 1
          fi
          ditto -c -k --sequesterRsrc --keepParent "$app" "anykeep-macos-${{ matrix.arch }}.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: anykeep-macos-${{ matrix.arch }}
          path: anykeep-macos-${{ matrix.arch }}.zip
          if-no-files-found: error
          compression-level: 0

  android:
    name: Android / ${{ matrix.abi }} APK
    if: ${{ github.event_name != 'schedule' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            qt-arch: android_arm64_v8a
          - abi: x86_64
            qt-arch: android_x86_64
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ env.ANDROID_NDK_VERSION }}

      - name: Install Qt Android
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_CURRENT_SERIES }}
          host: all_os
          target: android
          arch: ${{ matrix.qt-arch }}
          modules: qtmultimedia qttasktree
          aqtsource: ${{ env.AQT_WINDOWS_QT611_SOURCE }}
          cache: true

      - name: Download QCA/Iris/QtKeychain SDKs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir qca-sdk iris-sdk qtkeychain-sdk
          gh release download "$QCA_TAG" --repo psi-im/qca \
            -p "qca3-qt6-android-${{ matrix.abi }}.zip" -O qca.zip
          gh release download "$IRIS_TAG" --repo psi-im/iris \
            -p "iris-qt6-android-${{ matrix.abi }}.zip" -O iris.zip
          qtkeychain_asset="qtkeychain-${QTKEYCHAIN_VERSION}-${QTKEYCHAIN_REVISION}-qt6.11-android-${{ matrix.abi }}.tar.gz"
          gh release download "$QTKEYCHAIN_TAG" --repo "$GITHUB_REPOSITORY" \
            -p "$qtkeychain_asset" -O qtkeychain.tar.gz
          (cd qca-sdk && cmake -E tar xvf ../qca.zip)
          (cd iris-sdk && cmake -E tar xvf ../iris.zip)
          tar -xzf qtkeychain.tar.gz -C qtkeychain-sdk
          test -d qca-sdk/lib/cmake/Qca3-qt6
          test -d iris-sdk/lib/cmake/Iris
          test -f qtkeychain-sdk/lib/cmake/Qt6Keychain/Qt6KeychainConfig.cmake
          test -f qtkeychain-sdk/lib/libqt6keychain.a

      - name: Provision Android OpenSSL
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/KDAB/android_openssl.git android-openssl
          git -C android-openssl checkout "$ANDROID_OPENSSL_REVISION"
          test -f "android-openssl/ssl_3/${{ matrix.abi }}/libcrypto.a"
          test -f "android-openssl/ssl_3/${{ matrix.abi }}/libssl.a"

      - name: Configure and build APK
        shell: bash
        env:
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          qt_cmake=$(find "$QT_ROOT_DIR" -type f -name qt-cmake -print -quit)
          test -x "$qt_cmake"
          "$qt_cmake" -S . -B build/package -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DANDROID_PLATFORM="android-$ANDROID_API" \
            -DANYKEEP_BUILD_MOBILE=ON \
            -DANYKEEP_XMPP_BACKEND=IRIS \
            -DANYKEEP_QCA_SDK_ROOT="$PWD/qca-sdk" \
            -DANYKEEP_IRIS_SDK_ROOT="$PWD/iris-sdk" \
            -DANYKEEP_QTKEYCHAIN_SDK_ROOT="$PWD/qtkeychain-sdk" \
            -DANYKEEP_BUILD_BUNDLED_QCA=OFF \
            -DANYKEEP_BUILD_BUNDLED_IRIS=OFF \
            -DANYKEEP_BUILD_BUNDLED_QXMPP=OFF \
            -DANYKEEP_BUILD_BUNDLED_QCORO=OFF \
            -DANYKEEP_BUILD_BUNDLED_QTKEYCHAIN=OFF \
            -DANYKEEP_INSTALL_PREBUILT_SDK_RUNTIME=ON \
            -DANYKEEP_ANDROID_OPENSSL_ROOT="$PWD/android-openssl/ssl_3" \
            -DBUILD_TESTING=OFF
          cmake --build build/package --target apk --parallel 4
          mkdir packages
          apk=$(find build/package -type f -path '*/outputs/apk/*/*.apk' -print -quit)
          test -n "$apk"
          cp "$apk" "packages/AnyKeep-${{ matrix.abi }}.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: anykeep-android-${{ matrix.abi }}
          path: packages/*.apk
          if-no-files-found: error
          compression-level: 0