name: AnyKeep packages

on:
  workflow_dispatch:
    inputs:
      update_channel:
        description: Package/update channel for an explicit manual build
        required: true
        default: nightly
        type: choice
        options:
          - nightly
          - stable
  schedule:
    - cron: "0 3 * * *"
  push:
    tags: [ 'v*', '[0-9]*.[0-9]*.[0-9]*' ]

permissions:
  contents: read

env:
  QT_CURRENT_SERIES: "6.11.*"
  ANDROID_NDK_VERSION: r27c
  ANDROID_API: 28
  ANDROID_OPENSSL_REVISION: b71f1470962019bd89534a2919f5925f93bc5779
  WIX_VERSION: 6.0.2
  # Temporary until aqtinstall releases Qt 6.11+ Windows repository support.
  AQT_WINDOWS_QT611_SOURCE: "git+https://github.com/miurahr/aqtinstall.git@refs/pull/1000/head"

jobs:
  plan:
    name: Plan package build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      should_build: ${{ steps.gate.outputs.should_build }}
      update_channel: ${{ steps.channel.outputs.update_channel }}
      release_tag: ${{ steps.channel.outputs.release_tag }}
      iris_tag: ${{ steps.dependencies.outputs.iris_tag }}
      qca_tag: ${{ steps.dependencies.outputs.qca_tag }}
      qtkeychain_tag: ${{ steps.dependencies.outputs.qtkeychain_tag }}
      qtkeychain_version: ${{ steps.dependencies.outputs.qtkeychain_version }}
      qtkeychain_revision: ${{ steps.dependencies.outputs.qtkeychain_revision }}
      dependency_summary: ${{ steps.dependencies.outputs.dependency_summary }}
      dependency_fingerprint: ${{ steps.dependencies.outputs.dependency_fingerprint }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Select package channel
        id: channel
        shell: bash
        run: |
          set -euo pipefail

          tagged_release="$(
            git tag --points-at HEAD \
              | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' \
              | head -n 1 \
              || true
          )"
          if [[ -n "$tagged_release" ]]; then
            channel=stable
            release_tag="$tagged_release"
            echo "HEAD is tagged as $tagged_release; selecting stable."
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            channel="${{ inputs.update_channel }}"
            release_tag="$channel"
            echo "Manual build selected channel: $channel"
          else
            channel=nightly
            release_tag=nightly
            echo "Automatic untagged build; selecting nightly."
          fi

          printf 'update_channel=%s\n' "$channel" >> "$GITHUB_OUTPUT"
          printf 'release_tag=%s\n' "$release_tag" >> "$GITHUB_OUTPUT"

      - name: Resolve package dependencies
        id: dependencies
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 .github/scripts/resolve-package-dependencies.py \
            --mode "${{ steps.channel.outputs.update_channel }}"

      - name: Check whether a scheduled nightly is needed
        id: gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_CHANNEL: ${{ steps.channel.outputs.update_channel }}
          DEPENDENCY_FINGERPRINT: ${{ steps.dependencies.outputs.dependency_fingerprint }}
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" != "schedule" ]]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$UPDATE_CHANNEL" != "nightly" ]]; then
            echo "Scheduled HEAD is a stable/tagged commit; skipping."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          release_body="$(
            gh release view nightly --repo "$GITHUB_REPOSITORY" --json body --jq '.body' 2>/dev/null || true
          )"
          nightly_sha="$(
            printf '%s\n' "$release_body" \
              | sed -nE 's/.*<!-- anykeep-nightly-sha:([0-9a-f]{40}) -->.*/\1/p' \
              | tail -n 1
          )"
          nightly_deps="$(
            printf '%s\n' "$release_body" \
              | sed -nE 's/.*<!-- anykeep-nightly-deps:([0-9a-f]{64}) -->.*/\1/p' \
              | tail -n 1
          )"

          source_changed=true
          if [[ -n "$nightly_sha" ]] && git cat-file -e "$nightly_sha^{commit}" 2>/dev/null; then
            source_changed=false
            mapfile -t changed_files < <(git diff --name-only "$nightly_sha" HEAD)
            for path in "${changed_files[@]}"; do
              case "$path" in
                docs/*|README|README.*|AGENTS.md|*/AGENTS.md|LICENSE|LICENSE.*)
                  ;;
                *)
                  source_changed=true
                  echo "Build-relevant change: $path"
                  break
                  ;;
              esac
            done
          fi

          dependencies_changed=true
          if [[ -n "$nightly_deps" && "$nightly_deps" == "$DEPENDENCY_FINGERPRINT" ]]; then
            dependencies_changed=false
          fi

          if [[ "$source_changed" == false && "$dependencies_changed" == false ]]; then
            echo "No build-relevant AnyKeep changes and no compatible dependency updates; skipping nightly."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "Nightly inputs changed:"
            echo "  previous commit:       ${nightly_sha:-<none>}"
            echo "  current commit:        $GITHUB_SHA"
            echo "  source changed:        $source_changed"
            echo "  previous dependencies: ${nightly_deps:-<none>}"
            echo "  current dependencies:  $DEPENDENCY_FINGERPRINT"
            echo "  dependencies changed:  $dependencies_changed"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  debian:
    name: Debian package / Ubuntu ${{ matrix.ubuntu-version }}
    needs: plan
    if: ${{ needs.plan.outputs.should_build == 'true' }}
    env:
      IRIS_TAG: ${{ needs.plan.outputs.iris_tag }}
      QCA_TAG: ${{ needs.plan.outputs.qca_tag }}
    strategy:
      fail-fast: false
      matrix:
        ubuntu-version: ["24.04", "26.04"]
    runs-on: ubuntu-${{ matrix.ubuntu-version }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build Ubuntu Debian packages
        uses: ./.github/actions/build-deb-package
        with:
          profile: sdk-ubuntu-${{ matrix.ubuntu-version }}
          distribution: ubuntu
          distribution-version: ${{ matrix.ubuntu-version }}
          qca-tag: ${{ env.QCA_TAG }}
          iris-tag: ${{ env.IRIS_TAG }}
          github-token: ${{ github.token }}

      - uses: actions/upload-artifact@v7
        with:
          name: anykeep-deb-ubuntu-${{ matrix.ubuntu-version }}
          path: packages/*.deb
          if-no-files-found: error
          compression-level: 0

  debian13:
    name: Debian package / Debian 13
    needs: plan
    if: ${{ needs.plan.outputs.should_build == 'true' }}
    runs-on: ubuntu-latest
    container: debian:13
    timeout-minutes: 120
    env:
      IRIS_TAG: ${{ needs.plan.outputs.iris_tag }}
      QCA_TAG: ${{ needs.plan.outputs.qca_tag }}
    steps:
      - name: Bootstrap Debian container
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates cmake gh git python3

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build Debian 13 packages
        uses: ./.github/actions/build-deb-package
        with:
          profile: sdk-debian-13
          distribution: debian
          distribution-version: "13"
          qca-tag: ${{ env.QCA_TAG }}
          iris-tag: ${{ env.IRIS_TAG }}
          github-token: ${{ github.token }}

      - uses: actions/upload-artifact@v7
        with:
          name: anykeep-deb-debian-13
          path: packages/*.deb
          if-no-files-found: error
          compression-level: 0

  windows:
    name: Windows x64 package
    needs: plan
    if: ${{ needs.plan.outputs.should_build == 'true' }}
    runs-on: windows-2022
    env:
      ANYKEEP_WINDOWS_UPDATE_CHANNEL: ${{ needs.plan.outputs.update_channel }}
      ANYKEEP_RELEASE_TAG: ${{ needs.plan.outputs.release_tag }}
      IRIS_TAG: ${{ needs.plan.outputs.iris_tag }}
      QCA_TAG: ${{ needs.plan.outputs.qca_tag }}
      QTKEYCHAIN_TAG: ${{ needs.plan.outputs.qtkeychain_tag }}
      QTKEYCHAIN_VERSION: ${{ needs.plan.outputs.qtkeychain_version }}
      QTKEYCHAIN_REVISION: ${{ needs.plan.outputs.qtkeychain_revision }}
    timeout-minutes: 150
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Windows desktop build
        uses: ./.github/actions/setup-windows-desktop
        with:
          qt-version: ${{ env.QT_CURRENT_SERIES }}
          qca-tag: ${{ env.QCA_TAG }}
          iris-tag: ${{ env.IRIS_TAG }}
          qtkeychain-tag: ${{ env.QTKEYCHAIN_TAG }}
          qtkeychain-version: ${{ env.QTKEYCHAIN_VERSION }}
          qtkeychain-revision: ${{ env.QTKEYCHAIN_REVISION }}
          aqt-source: ${{ env.AQT_WINDOWS_QT611_SOURCE }}
          github-token: ${{ github.token }}

      - name: Set up WiX
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Install WiX
        run: |
          dotnet tool install --global wix --version $env:WIX_VERSION
          "$HOME\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & "$HOME\.dotnet\tools\wix.exe" extension add -g "WixToolset.Util.wixext/$env:WIX_VERSION"
          & "$HOME\.dotnet\tools\wix.exe" extension add -g "WixToolset.BootstrapperApplications.wixext/$env:WIX_VERSION"

      - name: Configure
        run: |
          $buildTesting = if ($env:ANYKEEP_WINDOWS_UPDATE_CHANNEL -eq "nightly") { "ON" } else { "OFF" }
          cmake -S . -B build/package -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            "-DANYKEEP_UPDATE_CHANNEL=$env:ANYKEEP_WINDOWS_UPDATE_CHANNEL" `
            "-DANYKEEP_UPDATE_BASE_URL=https://github.com/${{ github.repository }}/releases/download/$env:ANYKEEP_RELEASE_TAG" `
            -DANYKEEP_XMPP_BACKEND=IRIS `
            -DANYKEEP_QCA_SDK_ROOT="$pwd/qca-sdk" `
            -DANYKEEP_IRIS_SDK_ROOT="$pwd/iris-sdk" `
            -DANYKEEP_QTKEYCHAIN_SDK_ROOT="$pwd/qtkeychain-sdk" `
            -DANYKEEP_BUILD_BUNDLED_QCA=OFF `
            -DANYKEEP_BUILD_BUNDLED_IRIS=OFF `
            -DANYKEEP_BUILD_BUNDLED_QXMPP=OFF `
            -DANYKEEP_BUILD_BUNDLED_QCORO=OFF `
            -DANYKEEP_BUILD_BUNDLED_QTKEYCHAIN=OFF `
            -DANYKEEP_INSTALL_PREBUILT_SDK_RUNTIME=ON `
            "-DANYKEEP_MSIX_IDENTITY_NAME=${{ vars.ANYKEEP_MSIX_IDENTITY_NAME }}" `
            "-DANYKEEP_MSIX_PUBLISHER=${{ vars.ANYKEEP_MSIX_PUBLISHER }}" `
            "-DANYKEEP_MSIX_PUBLISHER_DISPLAY_NAME=${{ vars.ANYKEEP_MSIX_PUBLISHER_DISPLAY_NAME }}" `
            "-DBUILD_TESTING=$buildTesting"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build and test nightly tree
        if: ${{ needs.plan.outputs.update_channel == 'nightly' }}
        run: |
          cmake --build build/package --parallel 4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build/package --output-on-failure --timeout 180
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build canonical MSI/update payload and Burn installer
        run: |
          cmake --build build/package --target windows_update_package burn_installer --parallel 4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Store MSIX when identity is configured
        if: ${{ vars.ANYKEEP_MSIX_IDENTITY_NAME != '' && vars.ANYKEEP_MSIX_PUBLISHER != '' && vars.ANYKEEP_MSIX_PUBLISHER_DISPLAY_NAME != '' }}
        run: |
          cmake --build build/package --target msix_package --parallel 4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Explain skipped MSIX build
        if: ${{ vars.ANYKEEP_MSIX_IDENTITY_NAME == '' || vars.ANYKEEP_MSIX_PUBLISHER == '' || vars.ANYKEEP_MSIX_PUBLISHER_DISPLAY_NAME == '' }}
        run: |
          Write-Host "MSIX packaging is ready but Store identity is not configured."
          Write-Host "Configure ANYKEEP_MSIX_IDENTITY_NAME, ANYKEEP_MSIX_PUBLISHER and ANYKEEP_MSIX_PUBLISHER_DISPLAY_NAME."

      - uses: actions/upload-artifact@v7
        with:
          name: anykeep-windows-x64
          path: |
            build/package/AnyKeep.msi
            build/package/AnyKeep.Installer-*.exe
            build/package/AnyKeep-*-windows-x86_64.msix
            build/package/updates/*/*
          if-no-files-found: error
          compression-level: 0

  macos:
    name: macOS / ${{ matrix.arch }} package
    needs: plan
    if: ${{ needs.plan.outputs.should_build == 'true' }}
    env:
      IRIS_TAG: ${{ needs.plan.outputs.iris_tag }}
      QCA_TAG: ${{ needs.plan.outputs.qca_tag }}
      QTKEYCHAIN_TAG: ${{ needs.plan.outputs.qtkeychain_tag }}
      QTKEYCHAIN_VERSION: ${{ needs.plan.outputs.qtkeychain_version }}
      QTKEYCHAIN_REVISION: ${{ needs.plan.outputs.qtkeychain_revision }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_CURRENT_SERIES }}
          modules: qtmultimedia qttasktree
          cache: true

      - name: Install OpenSSL
        run: |
          brew list openssl@3 >/dev/null 2>&1 || brew install openssl@3
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"

      - name: Download QCA/Iris/QtKeychain SDKs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir qca-sdk iris-sdk qtkeychain-sdk
          gh release download "$QCA_TAG" --repo psi-im/qca \
            -p "qca3-qt6-macos-${{ matrix.arch }}.zip" -O qca.zip
          gh release download "$IRIS_TAG" --repo psi-im/iris \
            -p "iris-qt6-macos-${{ matrix.arch }}.zip" -O iris.zip
          qtkeychain_asset="qtkeychain-${QTKEYCHAIN_VERSION}-${QTKEYCHAIN_REVISION}-qt6.11-macos-${{ matrix.arch }}.tar.gz"
          gh release download "$QTKEYCHAIN_TAG" --repo "$GITHUB_REPOSITORY" \
            -p "$qtkeychain_asset" -O qtkeychain.tar.gz
          (cd qca-sdk && cmake -E tar xvf ../qca.zip)
          (cd iris-sdk && cmake -E tar xvf ../iris.zip)
          tar -xzf qtkeychain.tar.gz -C qtkeychain-sdk
          test -d qca-sdk/lib/cmake/Qca3-qt6
          test -d iris-sdk/lib/cmake/Iris
          test -f qtkeychain-sdk/lib/cmake/Qt6Keychain/Qt6KeychainConfig.cmake
          test -f qtkeychain-sdk/lib/libqt6keychain.a

      - name: Configure and build
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build/package -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DOPENSSL_ROOT_DIR="$OPENSSL_ROOT_DIR" \
            -DANYKEEP_XMPP_BACKEND=IRIS \
            -DANYKEEP_QCA_SDK_ROOT="$PWD/qca-sdk" \
            -DANYKEEP_IRIS_SDK_ROOT="$PWD/iris-sdk" \
            -DANYKEEP_QTKEYCHAIN_SDK_ROOT="$PWD/qtkeychain-sdk" \
            -DANYKEEP_BUILD_BUNDLED_QCA=OFF \
            -DANYKEEP_BUILD_BUNDLED_IRIS=OFF \
            -DANYKEEP_BUILD_BUNDLED_QXMPP=OFF \
            -DANYKEEP_BUILD_BUNDLED_QCORO=OFF \
            -DANYKEEP_BUILD_BUNDLED_QTKEYCHAIN=OFF \
            -DANYKEEP_INSTALL_PREBUILT_SDK_RUNTIME=ON \
            -DBUILD_TESTING=OFF
          cmake --build build/package --parallel 4
          cmake --install build/package --prefix "$PWD/stage"

      - name: Assemble standalone app bundle
        shell: bash
        run: |
          set -euo pipefail
          app="$PWD/stage/anykeep.app"
          test -d "$app"
          mkdir -p "$app/Contents/Frameworks" "$app/Contents/plugins" "$app/Contents/PlugIns/qca3-qt6/crypto"

          find stage/lib -maxdepth 1 \( -type f -o -type l \) -name 'libanykeep*.dylib' \
            -exec cp -a {} "$app/Contents/Frameworks/" \;
          if [ -d stage/lib/anykeep ]; then
            cp -a stage/lib/anykeep/. "$app/Contents/plugins/"
          fi
          find qca-sdk/lib -maxdepth 1 \( -type f -o -type l \) -name 'libqca*.dylib*' \
            -exec cp -a {} "$app/Contents/Frameworks/" \;
          find iris-sdk/lib -maxdepth 1 \( -type f -o -type l \) -name 'libiris*.dylib*' \
            -exec cp -a {} "$app/Contents/Frameworks/" \;
          find qca-sdk/lib/qca3-qt6/crypto -maxdepth 1 -type f -name '*.dylib' \
            -exec cp -a {} "$app/Contents/PlugIns/qca3-qt6/crypto/" \;

          openssl_lib="$(brew --prefix openssl@3)/lib"
          crypto="$openssl_lib/libcrypto.3.dylib"
          ssl="$openssl_lib/libssl.3.dylib"
          test -f "$crypto"
          test -f "$ssl"
          cp -a "$crypto" "$ssl" "$app/Contents/Frameworks/"

          "$QT_ROOT_DIR/bin/macdeployqt" "$app" "-qmldir=$PWD/libanykeep/qml" -always-overwrite

          crypto_name="$(basename "$crypto")"
          ssl_name="$(basename "$ssl")"
          bundled_crypto="$app/Contents/Frameworks/$crypto_name"
          bundled_ssl="$app/Contents/Frameworks/$ssl_name"
          install_name_tool -id "@rpath/$crypto_name" "$bundled_crypto"
          install_name_tool -id "@rpath/$ssl_name" "$bundled_ssl"

          # libssl and QCA providers are not Qt-owned dependencies, so macdeployqt
          # does not relocate their Homebrew OpenSSL install names for us. Keep
          # the provider independent of the main executable's LC_RPATH and make
          # libssl resolve libcrypto next to itself.
          while IFS= read -r dependency; do
            case "$dependency" in
              */libcrypto.3.dylib)
                install_name_tool -change "$dependency" "@loader_path/$crypto_name" "$bundled_ssl"
                ;;
            esac
          done < <(otool -L "$bundled_ssl" | tail -n +2 | sed -E 's/^[[:space:]]*([^[:space:]]+).*/\1/')

          while IFS= read -r -d '' provider; do
            while IFS= read -r dependency; do
              case "$dependency" in
                */libcrypto.3.dylib)
                  install_name_tool -change "$dependency" "@loader_path/../../../Frameworks/$crypto_name" "$provider"
                  ;;
                */libssl.3.dylib)
                  install_name_tool -change "$dependency" "@loader_path/../../../Frameworks/$ssl_name" "$provider"
                  ;;
              esac
            done < <(otool -L "$provider" | tail -n +2 | sed -E 's/^[[:space:]]*([^[:space:]]+).*/\1/')
          done < <(find "$app/Contents/PlugIns/qca3-qt6/crypto" -type f -name '*.dylib' -print0)

          bad_dependencies="$(
            find "$app" -type f -print0 | while IFS= read -r -d '' binary; do
              file "$binary" | grep -q 'Mach-O' || continue
              # Dependency records are indented. Ignore otool architecture
              # headers such as "... (architecture arm64):", which contain
              # the bundle path itself and otherwise cause false positives.
              otool -L "$binary" | sed -nE 's/^[[:space:]]+([^[:space:]]+).*/\1/p'
            done | grep -E "$PWD/(qca-sdk|iris-sdk|build|stage)|/(opt/homebrew|usr/local)/opt/openssl" || true
          )"
          if [ -n "$bad_dependencies" ]; then
            echo 'Non-relocatable dependency remains in the app bundle:' >&2
            printf '%s\n' "$bad_dependencies" >&2
            exit 1
          fi
          ditto -c -k --sequesterRsrc --keepParent "$app" "anykeep-macos-${{ matrix.arch }}.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: anykeep-macos-${{ matrix.arch }}
          path: anykeep-macos-${{ matrix.arch }}.zip
          if-no-files-found: error
          compression-level: 0


  android:
    name: Android / ${{ matrix.abi }} APK
    needs: plan
    if: ${{ needs.plan.outputs.should_build == 'true' }}
    env:
      IRIS_TAG: ${{ needs.plan.outputs.iris_tag }}
      QCA_TAG: ${{ needs.plan.outputs.qca_tag }}
      QTKEYCHAIN_TAG: ${{ needs.plan.outputs.qtkeychain_tag }}
      QTKEYCHAIN_VERSION: ${{ needs.plan.outputs.qtkeychain_version }}
      QTKEYCHAIN_REVISION: ${{ needs.plan.outputs.qtkeychain_revision }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            qt-arch: android_arm64_v8a
          - abi: x86_64
            qt-arch: android_x86_64
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build Android APK
        uses: ./.github/actions/build-android-apk
        with:
          abi: ${{ matrix.abi }}
          qt-arch: ${{ matrix.qt-arch }}
          qt-version: ${{ env.QT_CURRENT_SERIES }}
          ndk-version: ${{ env.ANDROID_NDK_VERSION }}
          android-api: ${{ env.ANDROID_API }}
          android-openssl-revision: ${{ env.ANDROID_OPENSSL_REVISION }}
          qca-tag: ${{ env.QCA_TAG }}
          iris-tag: ${{ env.IRIS_TAG }}
          qtkeychain-tag: ${{ env.QTKEYCHAIN_TAG }}
          qtkeychain-version: ${{ env.QTKEYCHAIN_VERSION }}
          qtkeychain-revision: ${{ env.QTKEYCHAIN_REVISION }}
          aqt-source: ${{ env.AQT_WINDOWS_QT611_SOURCE }}
          github-token: ${{ github.token }}

      - uses: actions/upload-artifact@v7
        with:
          name: anykeep-android-${{ matrix.abi }}
          path: packages/AnyKeep-${{ matrix.abi }}.apk
          if-no-files-found: error
          compression-level: 0


  publish-package-release:
    name: Publish complete package release
    needs: [plan, debian, debian13, windows, macos, android]
    if: >-
      ${{ always()
          && needs.plan.outputs.should_build == 'true'
          && needs.debian.result == 'success'
          && needs.debian13.result == 'success'
          && needs.windows.result == 'success'
          && needs.macos.result == 'success'
          && needs.android.result == 'success' }}
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IRIS_TAG: ${{ needs.plan.outputs.iris_tag }}
      QCA_TAG: ${{ needs.plan.outputs.qca_tag }}
      QTKEYCHAIN_TAG: ${{ needs.plan.outputs.qtkeychain_tag }}
      UPDATE_CHANNEL: ${{ needs.plan.outputs.update_channel }}
      RELEASE_TAG: ${{ needs.plan.outputs.release_tag }}
      DEPENDENCY_SUMMARY: ${{ needs.plan.outputs.dependency_summary }}
      DEPENDENCY_FINGERPRINT: ${{ needs.plan.outputs.dependency_fingerprint }}

    steps:
      - name: Download all package artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: anykeep-*
          path: downloaded

      - name: Assemble release assets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release-assets
          mkdir release-assets

          python - <<'PY'
          from pathlib import Path
          import zipfile

          downloaded = Path("downloaded")
          output = Path("release-assets")
          for artifact in (
              "anykeep-deb-ubuntu-24.04",
              "anykeep-deb-ubuntu-26.04",
              "anykeep-deb-debian-13",
          ):
              source = downloaded / artifact
              files = sorted(path for path in source.rglob("*.deb") if path.is_file())
              if not files:
                  raise SystemExit(f"No Debian packages found in {source}")
              target = output / f"{artifact}.zip"
              with zipfile.ZipFile(target, "w", compression=zipfile.ZIP_DEFLATED) as archive:
                  for path in files:
                      archive.write(path, path.name)
          PY

          find downloaded -type f -path '*/anykeep-macos-*/*.zip' -exec cp -v {} release-assets/ \;
          find downloaded -type f -path '*/anykeep-android-*/*.apk' -exec cp -v {} release-assets/ \;

          windows=downloaded/anykeep-windows-x64
          test -d "$windows"

          # The versioned MSI in updates/<channel> is the canonical direct
          # download and self-update payload. Do not publish the duplicate
          # build-tree AnyKeep.msi under a second name.
          find "$windows" -maxdepth 1 -type f \(             -name 'AnyKeep.Installer-*.exe' -o             -name 'AnyKeep-*-windows-x86_64.msix'           \) -exec cp -v {} release-assets/ \;

          channel_updates="$windows/updates/$UPDATE_CHANNEL"
          test -d "$channel_updates"
          find "$channel_updates" -maxdepth 1 -type f -exec cp -v {} release-assets/ \;

          echo "Release assets:"
          find release-assets -maxdepth 1 -type f -printf '  %f\n' | sort
          test -n "$(find release-assets -maxdepth 1 -type f -print -quit)"

      - name: Publish GitHub release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          release_tag="$RELEASE_TAG"
          if [[ "$UPDATE_CHANNEL" == "nightly" ]]; then
            release_title="AnyKeep Nightly"
            release_kind=(--prerelease)
          elif [[ "$release_tag" == "stable" ]]; then
            release_title="AnyKeep Stable"
            release_kind=()
          else
            release_title="AnyKeep $release_tag"
            release_kind=()
          fi

          if ! gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$release_tag" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$release_title" \
              "${release_kind[@]}" \
              --notes "Package artifacts are being published. No successful build marker has been recorded yet."
          fi

          declare -A new_assets=()
          for asset in release-assets/*; do
            name="$(basename "$asset")"
            new_assets["$name"]=1
            gh release upload "$release_tag" "$asset" --repo "$GITHUB_REPOSITORY" --clobber
          done

          mapfile -t old_assets < <(
            gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" \
              --json assets --jq '.assets[].name'
          )
          for name in "${old_assets[@]}"; do
            if [[ -z "${new_assets[$name]+x}" ]]; then
              gh release delete-asset "$release_tag" "$name" --repo "$GITHUB_REPOSITORY" --yes
            fi
          done

          built_at="$(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          notes_file="$RUNNER_TEMP/anykeep-release-notes.md"
          {
            if [[ "$UPDATE_CHANNEL" == "nightly" ]]; then
              echo "Rolling AnyKeep nightly build."
            else
              echo "AnyKeep stable package build."
            fi
            echo
            echo "Commit: $GITHUB_SHA"
            echo "Built: $built_at"
            echo
            echo "Dependencies:"
            echo "- Iris: $IRIS_TAG"
            echo "- QCA: $QCA_TAG"
            echo "- QtKeychain bundle: $QTKEYCHAIN_TAG"
            if [[ "$UPDATE_CHANNEL" == "nightly" ]]; then
              echo
              echo "<!-- anykeep-nightly-sha:$GITHUB_SHA -->"
              echo "<!-- anykeep-nightly-deps:$DEPENDENCY_FINGERPRINT -->"
            fi
          } >"$notes_file"

          edit_kind=()
          if [[ "$UPDATE_CHANNEL" == "nightly" ]]; then
            edit_kind=(--prerelease)
          fi

          gh release edit "$release_tag" --repo "$GITHUB_REPOSITORY" \
            --title "$release_title" \
            "${edit_kind[@]}" \
            --notes-file "$notes_file"
