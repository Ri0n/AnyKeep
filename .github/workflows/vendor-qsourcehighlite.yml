name: Vendor QSourceHighlite temporary

on:
  push:
    branches: [ build-with-sdk ]
    paths:
      - .github/workflows/vendor-qsourcehighlite.yml

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build-with-sdk
          fetch-depth: 0

      - name: Vendor pinned QSourceHighlite sources
        shell: bash
        run: |
          set -euo pipefail
          revision=d78f0d4171580a18646b15425c449db3f2bb240a
          base="https://raw.githubusercontent.com/Waqar144/QSourceHighlite/$revision"
          dir=3rdparty/qsourcehighlite
          mkdir -p "$dir"

          files=(
            LICENSE
            languagedata.cpp
            languagedata.h
            qsourcehighliter.cpp
            qsourcehighliter.h
            qsourcehighliterthemes.cpp
            qsourcehighliterthemes.h
          )
          expected=(
            f0c6f9a1e2efb6750ddebc614c636dace43bcca0
            63f6cfdf82e184f1c65278d4c9f97b21005b068f
            1ccdc04fb09e8c38bffc889b6af29ed3a530fe3c
            02c654ca78f806001f4c0101a79cf0a7bcb05470
            586378203f5d42653692d49cf9fc71f6b2ae9f69
            5ba7a8b2b8429a359584bd152ddcdf6444e25c5a
            eacabaec03e3c57794b52f69e2180d9201dddd32
          )

          for i in "${!files[@]}"; do
            file="${files[$i]}"
            curl --fail --location --retry 3 "$base/$file" -o "$dir/$file"
            actual=$(git hash-object "$dir/$file")
            test "$actual" = "${expected[$i]}" || {
              echo "Unexpected blob for $file: $actual" >&2
              exit 1
            }
          done

          git add "$dir"
          if git diff --cached --quiet; then
            echo 'QSourceHighlite sources are already vendored'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'Vendor QSourceHighlite sources'
          git push origin HEAD:build-with-sdk
