name: Finalize SDK packaging

on:
  push:
    branches: [ build-with-sdk ]

permissions:
  contents: write
  actions: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: build-with-sdk
      - name: Apply final fixes
        shell: bash
        env:
          PATCH_B64: 